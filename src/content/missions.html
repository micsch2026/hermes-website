<!--TITLE:Missionen — Hermes-->
<!--HEAD-->
<style>
  .mi-wrap { max-width: 1080px; margin: 0 auto; }
  .mi-meta { color: var(--c-text-dim); font-size: var(--text-sm); margin-bottom: var(--s-4); }
  .mi-error { display: none; border: 1px solid var(--c-err); color: var(--c-err);
              padding: var(--s-3) var(--s-4); border-radius: var(--r-md); margin-bottom: var(--s-4); }
  .mi-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--s-3); margin-bottom: var(--s-4); }
  .mi-card { background: var(--c-surface); border: 1px solid var(--c-border);
             border-radius: var(--r-lg); padding: var(--s-3) var(--s-4); }
  .mi-card.warn { border-color: var(--c-warn); }
  .mi-card.ok { border-color: var(--c-ok); }
  .mi-k { color: var(--c-text-dim); font-size: var(--text-sm); }
  .mi-v { font-size: 1.5rem; font-weight: 600; }
  .mi-s { color: var(--c-text-dim); font-size: var(--text-sm); }
  .mi-sec { margin-bottom: var(--s-6); }
  .mi-sec h2 { font-size: var(--text-lg); border-bottom: 1px solid var(--c-border); padding-bottom: var(--s-2); }
  .mi-count { color: var(--c-text-dim); font-weight: 400; font-size: var(--text-sm); }
  .mi-mission { background: var(--c-surface); border: 1px solid var(--c-border);
                border-radius: var(--r-lg); padding: var(--s-4); margin-bottom: var(--s-4); }
  .mi-m-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
  .mi-m-title { font-weight: 600; font-size: var(--text-lg); }
  .mi-m-pct { font-weight: 700; font-size: 1.6rem; color: var(--c-text-2); white-space: nowrap; }
  .mi-badge { border: 1px solid var(--c-border); border-radius: var(--r-sm);
              padding: 1px 8px; font-size: var(--text-sm); margin-left: 8px; }
  .mi-badge.ok { border-color: var(--c-ok); color: var(--c-ok); }
  .mi-badge.warn { border-color: var(--c-warn); color: var(--c-warn); }
  .mi-badge.err { border-color: var(--c-err); color: var(--c-err); }
  .mi-dim { color: var(--c-text-dim); font-size: var(--text-sm); }
  .mi-goal { color: var(--c-text-dim); font-size: var(--text-sm); margin-top: 2px;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; }
  /* Callout-Strip */
  .mi-callouts { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: var(--s-3) 0; }
  .mi-co { font-size: var(--text-sm); border: 1px solid var(--c-border); border-radius: var(--r-sm);
           padding: 2px 10px; color: var(--c-text-dim); background: var(--c-surface-2); }
  .mi-co.done { border-color: var(--c-ok); color: var(--c-ok); }
  .mi-co.run { border-color: var(--c-warn); color: var(--c-warn); }
  .mi-co.next { border-color: var(--c-accent); color: var(--c-accent); }
  /* Horizontaler Stepper */
  .mi-stepper { display: flex; align-items: flex-start; gap: 0; overflow-x: auto;
                padding: var(--s-2) 0; }
  .mi-step { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .mi-dot { width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center;
            justify-content: center; font-size: 0.8rem; border: 2px solid var(--c-border);
            background: var(--c-surface-2); color: var(--c-text-dim); }
  .mi-step.done .mi-dot { border-color: var(--c-ok); color: var(--c-ok); }
  .mi-step.running .mi-dot { border-color: var(--c-warn); color: var(--c-warn);
            animation: mi-pulse 1.4s ease-in-out infinite; }
  .mi-step.blocked .mi-dot { border-color: var(--c-err); color: var(--c-err); }
  @keyframes mi-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,180,0,0.0); }
                        50% { box-shadow: 0 0 0 5px rgba(255,180,0,0.20); } }
  .mi-step-lbl { font-size: 0.72rem; color: var(--c-text-dim); margin-top: 4px;
                 max-width: 72px; text-align: center; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .mi-conn { flex: 1 0 18px; min-width: 18px; height: 2px; margin-top: 13px;
             background: var(--c-border); }
  .mi-conn.done { background: var(--c-ok); }
  /* Segmentierter Fortschrittsbalken */
  .mi-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden;
            margin: var(--s-2) 0 2px; background: var(--c-surface-2); }
  .mi-seg { flex: 1; }
  .mi-seg.done { background: var(--c-ok); }
  .mi-seg.running { background: var(--c-warn); }
  .mi-seg.blocked { background: var(--c-err); }
  .mi-seg.pending { background: var(--c-border); }
  /* Sparkline */
  .mi-spark { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin: var(--s-3) 0 2px; }
  .mi-spark rect { fill: var(--c-accent); }
  .mi-spark .mi-spark-cap { color: var(--c-text-dim); font-size: 0.72rem; }
  /* Details */
  .mi-mission details { margin-top: var(--s-2); }
  .mi-mission summary { cursor: pointer; color: var(--c-text-dim); font-size: var(--text-sm); }
  .mi-stages { margin-top: var(--s-2); display: flex; flex-direction: column; gap: 4px; }
  .mi-stage { display: flex; align-items: baseline; gap: var(--s-2); font-size: var(--text-sm); flex-wrap: wrap; }
  .mi-stage .mi-st-id { color: var(--c-text-dim); min-width: 26px; }
  .mi-st-chip { border: 1px solid var(--c-border); border-radius: var(--r-sm); padding: 0 6px; font-size: 0.8rem; }
  .mi-st-chip.done { border-color: var(--c-ok); color: var(--c-ok); }
  .mi-st-chip.running { border-color: var(--c-warn); color: var(--c-warn); }
  .mi-st-chip.blocked { border-color: var(--c-err); color: var(--c-err); }
  .mi-gate { color: var(--c-err); }
  .mi-ev { color: var(--c-text-dim); font-family: monospace; font-size: 0.78rem; }
  .mi-blocker { color: var(--c-err); font-size: var(--text-sm); margin-top: var(--s-2); }
  .mi-log { margin-top: var(--s-2); border-top: 1px dashed var(--c-border); padding-top: var(--s-2); }
  .mi-log-line { color: var(--c-text-dim); font-size: 0.8rem; }
  .mi-li { padding: 2px 0; }
  .mi-sources { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .mi-src { border: 1px solid var(--c-border); border-radius: var(--r-sm);
            padding: 2px 8px; font-size: var(--text-sm); color: var(--c-text-dim); }
  .mi-runner { margin-bottom: var(--s-5); }
</style>
<!--/HEAD-->
<!--BODY-->
<div class="mi-wrap">
  <h1>🚀 Missionen</h1>
  <div class="mi-meta" id="mi-meta">Lade …</div>
  <div class="mi-error" id="mi-error"></div>

  <div class="mi-kpis" id="mi-kpis"></div>

  <div class="mi-card mi-runner">
    <div class="mi-k">⏭️ Nächster Runner-Lauf</div>
    <div class="mi-v" id="mi-next-run">—</div>
    <div class="mi-s" id="mi-next-run-note">Slots täglich 06/11/17 UTC (BZ)</div>
  </div>

  <section class="mi-sec">
    <h2>Aktive Missionen <span class="mi-count" id="mi-active-count"></span></h2>
    <div id="mi-active"></div>
  </section>

  <section class="mi-sec">
    <h2>Vorgeschlagen <span class="mi-count" id="mi-proposed-count"></span></h2>
    <div id="mi-proposed"></div>
  </section>

  <section class="mi-sec">
    <h2>Abgeschlossen <span class="mi-count" id="mi-done-count"></span></h2>
    <div id="mi-done"></div>
  </section>

  <section class="mi-sec">
    <h2>💡 Vorschläge (Board/System) <span class="mi-count" id="mi-proposals-count"></span></h2>
    <div id="mi-proposals"></div>
  </section>

  <section class="mi-sec">
    <h2>Quellen</h2>
    <div class="mi-sources" id="mi-sources"></div>
  </section>
</div>

<script>
(function () {
  var API = window.location.origin + '/api/missions/missions_status.json';
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dt(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleString('de-DE', {
        timeZone: 'Europe/Berlin', day: '2-digit', month: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    } catch (e) { return String(iso); }
  }
  function dayPrefix(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var ymd = d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });
      var today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });
      var y = new Date(); y.setDate(y.getDate() - 1);
      var yes = y.toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });
      if (ymd === today) return 'heute';
      if (ymd === yes) return 'gestern';
      return d.toLocaleDateString('de-DE', { timeZone: 'Europe/Berlin', day: '2-digit', month: '2-digit' });
    } catch (e) { return ''; }
  }
  function fmtAge(s) {
    if (s == null) return '?';
    if (s < 90) return s + ' s';
    if (s < 5400) return Math.round(s / 60) + ' min';
    if (s < 172800) return Math.round(s / 3600) + ' h';
    return Math.round(s / 86400) + ' d';
  }
  var TYPE_ICON = { data: '🧱', dev: '🛠️', lab: '🧪', shadow: '👻', demo: '🖥️',
                    live: '💶', research: '🔍' };
  var STATUS_CLS = { done: 'ok', active: 'ok', running: 'warn', blocked: 'err',
                     pending: '', proposed: 'warn', aborted: 'err' };
  var EVENT_DE = { progress: 'Fortschritt', stage: 'Etappe', evidence: 'Beleg',
                  note: 'Notiz', blocker: 'Blocker',
                  gate_request: 'Gate angefordert', gate_approved: 'Gate freigegeben',
                  gate_veto: 'Veto', proposal_approved: 'Vorschlag freigegeben',
                  auto_release_refused: 'Auto verweigert',
                  auto_release_capped: 'Auto gedeckelt' };
  function stepCls(st) {
    if (st === 'done' || st === 'running' || st === 'pending' || st === 'blocked') return st;
    return 'pending';
  }
  function dotSym(st) {
    if (st === 'done') return '✓';
    if (st === 'blocked') return '✕';
    if (st === 'running') return '●';
    return '';
  }

  function stageLine(s) {
    s = s || {};
    var g = s.gate || {};
    var gate = '';
    if (g.state === 'pending') {
      gate = '<span class="mi-gate" title="' + esc(g.reason || '') + '">🔴 Gate offen (' + esc(g.kind) + ')</span>';
    } else if (g.state === 'approved') {
      gate = '<span class="mi-dim" title="' + esc(g.reason || '') + '">✅ Gate genehmigt</span>';
    } else if (g.kind) {
      gate = '<span class="mi-dim">Gate: ' + esc(g.kind) + '</span>';
    }
    var ev = (s.evidence || []).map(function (e) {
      return '<div class="mi-ev">📎 ' + esc(e) + '</div>';
    }).join('');
    var blocker = s.blocker ? '<div class="mi-blocker">⛔ ' + esc(s.blocker) + '</div>' : '';
    return '<div class="mi-stage">' +
      '<span class="mi-st-id">' + esc(s.id) + '</span>' +
      '<span>' + (TYPE_ICON[s.type] || '•') + '</span>' +
      '<span class="mi-dim">' + esc(s.type || '') + '</span>' +
      '<span>' + esc(s.title || '') + '</span>' +
      '<span class="mi-st-chip ' + (STATUS_CLS[s.status] || '') + '">' + esc(s.status) + '</span>' +
      (gate ? ' ' + gate : '') + '</div>' + ev + blocker;
  }

  function stepper(stages) {
    if (!stages.length) return '';
    var html = '<div class="mi-stepper">';
    stages.forEach(function (s, i) {
      s = s || {};
      var cls = stepCls(s.status);
      var full = (s.title || s.id || '') + ' · ' + (s.type || '') + ' · ' + (s.status || '');
      var lbl = (s.title || s.id || '');
      html += '<div class="mi-step ' + cls + '" title="' + esc(full) + '">' +
        '<span class="mi-dot">' + dotSym(s.status) + '</span>' +
        '<span class="mi-step-lbl">' + esc(lbl) + '</span></div>';
      if (i < stages.length - 1) {
        html += '<span class="mi-conn' + (s.status === 'done' ? ' done' : '') + '"></span>';
      }
    });
    return html + '</div>';
  }

  function segBar(stages) {
    if (!stages.length) return '';
    return '<div class="mi-bar">' + stages.map(function (s) {
      return '<span class="mi-seg ' + stepCls((s || {}).status) + '"></span>';
    }).join('') + '</div>';
  }

  function sparkline(activity) {
    var a = activity || [];
    if (!a.length) return '';
    var max = Math.max.apply(null, a.concat([1]));
    var w = a.length * 10;
    var bars = a.map(function (v, i) {
      var h = Math.round(30 * v / max);
      if (v > 0 && h < 2) h = 2;
      var d = new Date(); d.setDate(d.getDate() - (a.length - 1 - i));
      var label = d.toLocaleDateString('de-DE', { timeZone: 'Europe/Berlin', day: '2-digit', month: '2-digit' });
      return '<rect x="' + (i * 10) + '" y="' + (30 - h) + '" width="7" height="' + h + '" rx="1">' +
        '<title>' + esc(label) + ' · ' + v + '</title></rect>';
    }).join('');
    return '<svg class="mi-spark" width="' + w + '" height="30" viewBox="0 0 ' + w + ' 30" role="img" ' +
      'aria-label="Aktivitaet 14 Tage">' + bars + '</svg>' +
      '<div class="mi-spark-cap">Aktivität 14 Tage</div>';
  }

  function callouts(m) {
    var now = m.now || {};
    var out = '';
    if (now.last_done) {
      out += '<span class="mi-co done">✅ Zuletzt erledigt: ' + esc(now.last_done.title) + '</span>';
    }
    if (now.running) {
      out += '<span class="mi-co run">🔄 Läuft (seit ' + esc(dt(now.running.since)) + '): ' +
        esc(now.running.title) + '</span>';
    }
    if (now.next) {
      out += '<span class="mi-co next">⏭️ Als Nächstes: ' + esc(now.next.title) +
        (m.eta_hint ? ' — ' + esc(m.eta_hint) : '') + '</span>';
    }
    return out ? '<div class="mi-callouts">' + out + '</div>' : '';
  }

  function missionCard(m) {
    var stages = m.stages || [];
    var logs = m.log_tail || [];
    var stageRows = stages.map(stageLine).join('');
    var logRows = logs.map(function (l) {
      var evt = EVENT_DE[l.event] || l.event || '';
      var pre = dayPrefix(l.ts);
      return '<div class="mi-log-line">' + esc(pre) + ' · ' + esc(dt(l.ts)) + ' · ' +
        esc(evt) + (l.stage ? ' [' + esc(l.stage) + ']' : '') + ' — ' + esc(l.text || '') + '</div>';
    }).join('');
    return '<div class="mi-mission">' +
      '<div class="mi-m-head">' +
        '<div class="mi-m-title">' + esc(m.title || '') +
          ' <span class="mi-badge ' + (STATUS_CLS[m.status] || '') + '">' + esc(m.status) + '</span>' +
          (m.status === 'proposed' ? ' <span class="mi-dim">wartet auf Start-Freigabe</span>' : '') +
        '</div>' +
        '<div class="mi-m-pct">' + (m.pct || 0) + '%</div>' +
      '</div>' +
      '<div class="mi-goal" title="' + esc(m.goal || '') + '">' + esc(m.goal || '') + '</div>' +
      callouts(m) +
      stepper(stages) +
      segBar(stages) +
      '<div class="mi-dim">' + (m.done || 0) + '/' + (m.total || 0) + ' · ' + (m.pct || 0) + '% · ' +
      'angelegt ' + esc(dt(m.created_at)) + ' · Stand ' + esc(dt(m.updated_at)) + '</div>' +
      sparkline(m.activity) +
      (stageRows ? '<details><summary>Etappen-Details (' + stages.length + ')</summary>' +
        '<div class="mi-stages">' + stageRows + '</div></details>' : '') +
      (logRows ? '<details><summary>Verlauf (' + logs.length + ')</summary>' +
        '<div class="mi-log">' + logRows + '</div></details>' : '') +
      '</div>';
  }

  function render(d) {
    var k = d.kpis || {};
    $('mi-meta').innerHTML = 'Datenstand <b>' + dt(d.generated_at) +
      '</b> · Auto-Refresh 120 s · Missionslayer (Supervisor)';
    var inProg = (k.stages_total || 0) > 0
      ? Math.round(100 * (k.stages_done || 0) / k.stages_total) : 0;
    $('mi-kpis').innerHTML =
      '<div class="mi-card ' + ((k.active || 0) > 0 ? 'ok' : '') + '">' +
        '<div class="mi-k">Aktive Missionen</div><div class="mi-v">' + (k.active || 0) + '</div>' +
        '<div class="mi-s">' + (k.proposed || 0) + ' vorgeschlagen · ' + (k.finished || 0) + ' abgeschlossen</div></div>' +
      '<div class="mi-card ' + ((k.gates_open || 0) > 0 ? 'warn' : 'ok') + '">' +
        '<div class="mi-k">Offene Gates</div><div class="mi-v">' + (k.gates_open || 0) + '</div>' +
        '<div class="mi-s">User-Entscheide eingefordert</div></div>' +
      '<div class="mi-card">' +
        '<div class="mi-k">Etappen-Fortschritt</div><div class="mi-v">' + inProg + '%</div>' +
        '<div class="mi-s">' + (k.stages_done || 0) + '/' + (k.stages_total || 0) + ' Etappen (aktiv)</div></div>' +
      '<div class="mi-card ' + ((d.proposals || []).length > 0 ? 'warn' : '') + '">' +
        '<div class="mi-k">Mission-Vorschläge</div><div class="mi-v">' + (d.proposals || []).length + '</div>' +
        '<div class="mi-s">approven per mission.py proposals</div></div>';

    $('mi-next-run').textContent = d.next_runner_run ? dt(d.next_runner_run) : '—';
    $('mi-next-run-note').textContent = d.next_runner_run
      ? 'BZ · Slots täglich 06/11/17 UTC'
      : 'kein Lauf geplant (Store leer?)';

    var ms = d.missions || [];
    function pick(list) { return list.map(missionCard).join('') || '<div class="mi-dim">— keine —</div>'; }
    var act = ms.filter(function (m) { return m.status === 'active' || m.status === 'blocked'; });
    var prp = ms.filter(function (m) { return m.status === 'proposed'; });
    var fin = ms.filter(function (m) { return m.status === 'done' || m.status === 'aborted'; });
    $('mi-active-count').textContent = '(' + act.length + ')';
    $('mi-proposed-count').textContent = '(' + prp.length + ')';
    $('mi-done-count').textContent = '(' + fin.length + ')';
    $('mi-active').innerHTML = pick(act);
    $('mi-proposed').innerHTML = pick(prp);
    $('mi-done').innerHTML = pick(fin);

    var props = d.proposals || [];
    $('mi-proposals-count').textContent = '(' + props.length + ')';
    $('mi-proposals').innerHTML = props.length === 0
      ? '<div class="mi-dim">Keine offenen Vorschläge — Board kann via mission.py propose Vorschläge einreichen.</div>'
      : props.map(function (p) {
          return '<div class="mi-li">💡 <b>' + esc(p.title) + '</b> <span class="mi-dim">[' +
                 esc(p.by) + ' · ' + esc(dt(p.ts)) + ']</span><div class="mi-dim">' + esc(p.goal) + '</div></div>';
        }).join('');

    $('mi-sources').innerHTML = (d.sources || []).map(function (s) {
      return '<span class="mi-src">' + esc(s.name) + ' · vor ' + fmtAge(s.age_s) + '</span>';
    }).join('');
  }

  function load() {
    fetch(API, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      $('mi-error').style.display = 'none';
      render(d);
    }).catch(function (e) {
      var el = $('mi-error');
      el.textContent = 'Daten konnten nicht geladen werden: ' + e.message;
      el.style.display = 'block';
    });
  }
  load();
  setInterval(load, 120000);
})();
</script>
<!--/BODY-->
