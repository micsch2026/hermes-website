/* Detail modal */

  max-width: 700px; width: 100%; padding: 1.5rem; }

.sl4-modal .detail-value { font-size: 0.9rem; font-weight: 600; }

.sl4-summary { display: flex; gap: 1.5rem; margin-bottom: 1rem; flex-wrap: wrap; }

/* R&D Live */
.rd-card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 0.6rem; padding: 0.9rem 1rem; margin-bottom: 0.9rem; }

.rd-cluster-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }

.rd-cluster-chip.cool { border-color: rgba(234,179,8,0.4); color: #eab308; }
.rd-cluster-chip.open { color: var(--dim); }
.rd-timeline { display: flex; flex-direction: column; gap: 0.35rem; }
.rd-tl-row { display: flex; gap: 0.6rem; align-items: baseline; font-size: 0.8rem; }
.rd-tl-cluster { font-weight: 600; min-width: 130px; }
.rd-tl-result { color: var(--dim); }
/* R&D Dashboard Visual */
.rd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 0.9rem; margin-bottom: 0.9rem; }
.rd-grid-wide { grid-column: 1 / -1; }
.rd-chart-wrap { position: relative; width: 100%; }
.rd-chart-wrap.h200 { height: 200px; }

.rd-chart-wrap.h280 { height: 280px; }

.rd-kpi-val { font-size: 1.4rem; font-weight: 700; }
.rd-kpi-label { font-size: 0.68rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.12rem; }
.rd-section-title { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 0.8rem 0 0.4rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
.rd-activity-strip { display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
.rd-activity-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

<div class="sl4-wrap">
  <div class="sl4-header">
    <h1>Strategy Lab</h1>
    <div class="meta" id="sl4-updated">Loading...</div>
    <div id="sl4-pipeline-status" style="margin-top:0.5rem;font-size:0.8rem;"></div>
  </div>
  <div class="sl4-summary" id="sl4-summary"></div>

    <button class="sl4-tab active" data-tab="deploy">🚀 Strategien <span class="badge" id="badge-deploy">0</span></button>

  </div>

    <input class="sl4-search" id="sl4-search" placeholder="Suche nach Name, Asset, Typ..." type="text">
    <button class="sl4-filter active" data-filter="all">Alle</button>
    <button class="sl4-filter" data-filter="recipe">🧬 Archetypes</button>
    <button class="sl4-filter" data-filter="tier-a">⭐ Tier A</button>
    <button class="sl4-filter" data-filter="ho-passed">✅ HO bestanden</button>
    <button class="sl4-filter" data-filter="fire">🔥 Feuer-Test</button>
  </div>
  <div id="sl4-content"></div>
</div>

<div class="sl4-modal-overlay" id="sl4-modal-overlay">

<script>
let catalogData = null;
let shadowData = null;
let pipelineStatus = null;
let rdData = null;
let currentTab = 'deploy';
let currentFilter = 'all';
let sortCol = 'score';
let sortDir = 'desc';
let searchTerm = '';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadData() {
  const resp = await fetch('/api/strategy-lab/catalog.json?_=' + Date.now());
  catalogData = await resp.json();
  // Load shadow portfolio
  try {
    const sr = await fetch('/api/strategy-lab/shadow_portfolio.json?_=' + Date.now());
    shadowData = await sr.json();
  } catch(e) { shadowData = {strategies: [], open_positions: [], total_trades: 0}; }
  // Load pipeline status
  try {
    const pr = await fetch('/api/strategy-lab/pipeline_status.json?_=' + Date.now());
    pipelineStatus = await pr.json();
  } catch(e) { pipelineStatus = null; }
  // Load R&D Live data
  try {
    const rr = await fetch('/api/strategy-lab/rd_live.json?_=' + Date.now());
    rdData = await rr.json();
  } catch(e) { rdData = null; }
  render();
}

function render() {
  if (!catalogData) return;
  document.getElementById('sl4-updated').textContent =
    'Updated: ' + new Date(catalogData.updated_at).toLocaleString('de-DE');

  // Pipeline status banner
  if (pipelineStatus) {
    let html = '';
    const dot = pipelineStatus.is_running ? '🔴' : '🟢';
    const state = pipelineStatus.is_running ? 'Pipeline läuft' : 'Pipeline idle';
    html += `<span style="color:${pipelineStatus.is_running?'var(--blue)':'var(--dim)'}">${dot} ${state}</span>`;
    if (pipelineStatus.running_recipe) {
      html += ` · <span style="color:var(--blue)">${pipelineStatus.running_recipe.name}</span>`;
    }
    if (pipelineStatus.queue_size > 0) {
      html += ` · 📋 ${pipelineStatus.queue_size} in Queue`;
    }
    if (pipelineStatus.last_run) {
      const lastTime = new Date(pipelineStatus.last_run.completed_at + 'Z').toLocaleString('de-DE');
      html += ` · Last: <span style="color:var(--dim)">${pipelineStatus.last_run.name} (${lastTime})</span>`;
    }
    if (pipelineStatus.shadow) {
      html += ` · 👻 ${pipelineStatus.shadow.strategies} Strategien`;
      if (pipelineStatus.shadow.open_positions > 0) {
        html += ` · ${pipelineStatus.shadow.open_positions} offene Shadow-Positionen`;
      }
    }
    html += ` · ⏰ R&D: ${pipelineStatus.rd_schedule.execution}`;
    document.getElementById('sl4-pipeline-status').innerHTML = html;
  }
  // Summary
  const s = catalogData.summary;
  document.getElementById('sl4-summary').innerHTML = `
    <div class="stat"><div class="stat-value" style="color:var(--green)">${s.deploy_candidates}</div><div class="stat-label">Deploy-Kandidaten</div></div>
  `;
  document.getElementById('badge-deploy').textContent = s.deploy_candidates;
  if (rdData && rdData.today) {
    document.getElementById('badge-rdlive').textContent = rdData.today.length;
  }
  if (shadowData) {
    document.getElementById('badge-shadow').textContent = shadowData.total_trades || 0;
    // Update summary with shadow stats
    const ss = shadowData;
    const nStrat = (ss.strategies||[]).length;
    const totalTrades = ss.total_trades || 0;
    const openPos = (ss.open_positions||[]).length;
    const profitStrats = (ss.strategies||[]).filter(x => x.net_pnl > 0).length;
    document.getElementById('sl4-summary').innerHTML += `
      <div class="stat"><div class="stat-value" style="color:var(--purple)">${nStrat}</div><div class="stat-label">Shadow Strategien</div></div>
      <div class="stat"><div class="stat-value" style="color:var(--blue)">${totalTrades}</div><div class="stat-label">Shadow Trades</div></div>
      <div class="stat"><div class="stat-value" style="color:var(--green)">${profitStrats}</div><div class="stat-label">Profitabel</div></div>
      <div class="stat"><div class="stat-value" style="color:var(--yellow)">${openPos}</div><div class="stat-label">Offen</div></div>
    `;
  }
  renderTable();
}

function renderTable() {
  if (currentTab === 'rdlive') { renderRdLive(); return; }
  if (currentTab === 'shadow') { renderShadowDashboard(); return; }
  let data = [];
  let columns = [];
  if (currentTab === 'deploy') { data = catalogData.deploy; columns = deployCols; }
  else { data = (shadowData && shadowData.strategies) ? shadowData.strategies : []; columns = shadowCols; }

  // Filter
  data = data.filter(row => {
    if (currentFilter === 'recipe' && !row.is_recipe && currentTab === 'deploy') return false;
    if (currentFilter === 'tier-a' && row.tier !== 'A' && currentTab === 'deploy') return false;
    if (currentFilter === 'ho-passed' && row.ho_status !== 'passed' && currentTab === 'deploy') return false;
    if (currentFilter === 'fire' && !row.fire_test && currentTab === 'deploy') return false;
    if (searchTerm) {
      const hay = JSON.stringify(row).toLowerCase();
      if (!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  });

  // Sort
  data.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (sortDir === 'asc') return va > vb ? 1 : -1;
    return va < vb ? 1 : -1;
  });

  let html = '<table class="sl4-table"><thead><tr>';
  for (const col of columns) {
    const cls = sortCol === col.key ? 'sorted-' + sortDir : '';
    html += `<th class="${cls}" onclick="setSort('${col.key}')">${col.label}</th>`;
  }
  html += '</tr></thead><tbody>';
  for (const row of data) {
    html += '<tr onclick="showDetail(' + JSON.stringify(row).replace(/"/g, '&quot;') + ')">';
    for (const col of columns) {
      html += '<td' + (col.num ? ' class="num"' : '') + '>' + (col.render ? col.render(row) : (row[col.key] ?? '—')) + '</td>';
    }
    html += '</tr>';
  }
  if (data.length === 0) html += '<tr><td colspan="' + columns.length + '" style="text-align:center;color:var(--dim);padding:2rem">Keine Ergebnisse</td></tr>';
  html += '</tbody></table>';
  document.getElementById('sl4-content').innerHTML = html;
}

const deployCols = [
  {key:'id', label:'ID', render: r => `<strong>#${r.id}</strong>`},
  {key:'name', label:'Strategie / Ansatz', render: r => `<div><div style="font-weight:600">${r.name || r.label}</div><span style="font-size:0.75rem;color:var(--dim)">${(r.assets||[]).join(', ')}</span></div>`},
  {key:'score', label:'Score', num: true},
  {key:'pf', label:'PF', num: true, render: r => r.pf.toFixed(2)},
  {key:'pnl', label:'PnL', num: true, render: r => `<span class="${r.pnl>0?'pos':'neg'}">${r.pnl>0?'+':''}${r.pnl}€</span>`},
  {key:'pnl_per_month', label:'€/Mon', num: true, render: r => r.pnl_per_month ? `<span class="${r.pnl_per_month>0?'pos':'neg'}" style="font-weight:600">${r.pnl_per_month>0?'+':''}${r.pnl_per_month}€</span>` : '—'},
  {key:'trades', label:'Tr', num: true},
  {key:'trades_per_week', label:'Tr/Wk', num: true, render: r => r.trades_per_week != null ? r.trades_per_week : '—'},
  {key:'avg_trade', label:'Ø/Tr', num: true, render: r => r.avg_trade != null ? `<span class="${r.avg_trade>0?'pos':'neg'}">${r.avg_trade>0?'+':''}${r.avg_trade}€</span>` : '—'},
  {key:'tier', label:'Tier', render: r => `<span class="tier-${r.tier.toLowerCase()}">${r.tier}</span>`},
  {key:'archetype', label:'Typ', render: r => r.is_new ? '<span class="new-badge">ARCHETYPE</span> ' + r.archetype.slice(0,15) : r.archetype.slice(0,15)},
  {key:'bot', label:'Bot', render: r => r.bot ? `<span class="bot-badge">${r.bot}</span>` : ''},
  {key:'fire_test', label:'🔥', render: r => r.fire_test === true ? '✅' : r.fire_test === false ? '❌' : '—'},
  {key:'ho_status', label:'HO', render: r => {
    if (r.ho_status === 'passed') return '<span class="gate gate-pass">✅</span>';
    if (r.ho_status === 'warning') return '<span class="gate gate-fail">⚠️</span>';
    return '<span style="color:var(--dim)">➖</span>';
  }},
];
const pipelineCols = [
  {key:'score', label:'Score', num: true},
  {key:'best_pf', label:'PF', num: true},
  {key:'best_pnl', label:'PnL', num: true, render: r => `<span class="${r.best_pnl>0?'pos':'neg'}">${r.best_pnl>0?'+':''}${r.best_pnl}€</span>`},
  {key:'best_trades', label:'Trades', num: true},
  {key:'tier', label:'Tier', render: r => `<span class="tier-${(r.tier||'c').toLowerCase()}">${r.tier||'?'}</span>`},
  {key:'name', label:'Recipe'},
  {key:'assets', label:'Assets', render: r => (r.assets||[]).join(', ').slice(0,25)},
  {key:'profitable_combos', label:'Profit', num: true, render: r => `${r.profitable_combos}/${r.total_combos}`},
];
const archiveCols = [
  {key:'id', label:'ID'},
  {key:'name', label:'Name'},
  {key:'pf', label:'PF', num: true, render: r => r.pf.toFixed(2)},
  {key:'pnl', label:'PnL', num: true, render: r => `<span class="${r.pnl>0?'pos':'neg'}">${r.pnl>0?'+':''}${r.pnl}€</span>`},
  {key:'trades', label:'Trades', num: true},
  {key:'tier', label:'Tier', render: r => `<span class="tier-${(r.tier||'c').toLowerCase()}">${r.tier||'?'}</span>`},
  {key:'status', label:'Status'},
];

const shadowCols = [
  {key:'id', label:'ID', render: r => {
    let badge = '';
    const bh = r.bot_health;
    if (bh === 'strong') badge = ' <span class="gate gate-pass" title="Bot stark im Shadow-Forward">🤖🟢</span>';
    else if (bh === 'weak') badge = ' <span class="gate gate-fail" title="Bot schwach — Alternative prüfen">🤖🔴</span>';
    else if (bh === 'ok') badge = ' <span class="gate gate-na" title="Bot neutral im Shadow-Forward">🤖🟡</span>';
    else if (bh === 'new') badge = ' <span class="gate gate-na" title="Zu wenig Forward-Daten">🤖⚪</span>';
    return `<strong>#${r.id}</strong>${badge}`;
  }},
  {key:'shadow_flag', label:'Flag', render: r => {
    if (r.shadow_flag === 'deploy_ready') return '<span class="gate gate-pass">🚀</span>';
    if (r.shadow_flag === 'busted') return '<span class="gate gate-fail">💀</span>';
    return '';
  }},
  {key:'name', label:'Strategie', render: r => `<span style="font-size:0.75rem">${(r.name||'').slice(0,40)}</span>`},
  {key:'days_active', label:'Tage', num: true, render: r => {
    if (!r.days_active || r.days_active === 0) return '—';
    const d = Math.floor(r.days_active);
    const start = r.start_date ? new Date(r.start_date).toLocaleDateString('de-DE') : '';
    return `<span style="color:var(--dim)">${d}d</span> <span style="font-size:0.65rem;color:var(--dim)">seit ${start}</span>`;
  }},
  {key:'equity', label:'Konto', num: true, render: r => {
    const pct = ((r.equity - 1000) / 1000 * 100);
    const cls = r.equity >= 1000 ? 'pos' : 'neg';
    return `<span class="${cls}" style="font-weight:600">${r.equity.toFixed(0)}€</span> <span style="font-size:0.7rem;color:var(--dim)">${pct>=0?'+':''}${pct.toFixed(1)}%</span>`;
  }},
  {key:'net_pnl', label:'PnL', num: true, render: r => r.net_pnl !== 0 ? `<span class="${r.net_pnl>=0?'pos':'neg'}" style="font-weight:600">${r.net_pnl>=0?'+':''}${r.net_pnl.toFixed(2)}€</span>` : '—'},
  {key:'trades', label:'Live Tr', num: true, render: r => r.trades > 0 ? r.trades : '—'},
  {key:'shadow_trades_week', label:'Tr/Wk', num: true, render: r => {
    if (r.shadow_trades_week != null) return `<span style="color:var(--blue)">${r.shadow_trades_week}</span>`;
    if (r.oos_trades_week != null) return `<span style="color:var(--dim)">${r.oos_trades_week}</span>`;
    return '—';
  }},
  {key:'shadow_avg_trade', label:'Ø €/Tr', num: true, render: r => {
    // USER (06.08.): durchschnittlicher BETRAG (Mean der Absolutwerte), immer positiv
    if (r.shadow_avg_trade != null) return `${r.shadow_avg_trade}€`;
    if (r.oos_avg_trade != null) return `<span style="color:var(--dim)">${r.oos_avg_trade}€</span>`;
    return '—';
  }},
  {key:'pnl_per_week', label:'€/Wk', num: true, render: r => {
    if (r.pnl_per_week != null) return `<span class="${r.pnl_per_week>=0?'pos':'neg'}" style="font-weight:600">${r.pnl_per_week>=0?'+':''}${r.pnl_per_week}€</span>`;
    return '—';
  }},
  {key:'win_rate', label:'WR', num: true, render: r => r.trades > 0 ? r.win_rate.toFixed(0)+'%' : '—'},
  {key:'oos_pf', label:'OOS PF', num: true, render: r => `<span style="color:var(--dim)">${r.oos_pf.toFixed(2)}</span>`},
  {key:'oos_avg_trade', label:'OOS Ø €/Tr', num: true, render: r => r.oos_avg_trade != null ? `<span style="color:var(--dim)">${r.oos_avg_trade}€</span>` : '—'},
  {key:'gap_pct', label:'Gap', num: true, render: r => {
    if (r.gap_pct == null) return '—';
    const cls = r.gap_pct > 0 ? 'pos' : 'neg';
    return `<span class="${cls}">${r.gap_pct}%</span>`;
  }},
  {key:'max_consec_loss', label:'Max Loss', num: true, render: r => r.max_consec_loss > 3 ? `<span class="neg">⚠️ ${r.max_consec_loss}</span>` : (r.max_consec_loss || '—')},
];

function setSort(col) {
  if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
  else { sortCol = col; sortDir = 'desc'; }
  renderTable();
}

function showDetailById(sid) {
  const data = (shadowData && shadowData.strategies) ? shadowData.strategies : [];
  const row = data.find(r => String(r.id) === String(sid));
  if (row) showDetail(row);
}

function showDetail(row) {
  const m = document.getElementById('sl4-modal-content');
  let html = `<span class="close" onclick="document.getElementById('sl4-modal-overlay').classList.remove('show')">×</span>`;
  html += `<h2>${row.name || row.label || '#' + row.id}</h2>`;

  if (currentTab === 'shadow') {
    // Shadow-spezifischer Header: Live-Forward-Test vs OOS-Referenz
    if (row.shadow_flag === 'deploy_ready') html += '<div style="padding:0.5rem 0.8rem;margin-bottom:0.8rem;border-radius:6px;background:var(--green-dim);color:var(--green);font-weight:600">🚀 Deploy-Ready — Forward-Test bestätigt OOS-Prognose</div>';
    else if (row.shadow_flag === 'busted') html += '<div style="padding:0.5rem 0.8rem;margin-bottom:0.8rem;border-radius:6px;background:var(--red-dim);color:var(--red);font-weight:600">💀 Busted — Strategie widerlegt sich im Forward-Test</div>';
    // Bot-Health-Ampel (2026-09-04)
    const bhMap = {
      strong: ['var(--green-dim)', 'var(--green)', '🤖🟢 Bot-Instanz STARK'],
      ok:     ['rgba(59,130,246,0.12)', 'var(--blue)', '🤖🟡 Bot-Instanz NEUTRAL'],
      weak:   ['var(--red-dim)', 'var(--red)', '🤖🔴 Bot-Instanz SCHWACH'],
      new:    ['rgba(107,114,128,0.12)', 'var(--dim)', '🤖⚪ Zu wenig Daten'],
    };
    if (bhMap[row.bot_health]) {
      const [bg, fg, title] = bhMap[row.bot_health];
      html += `<div style="padding:0.5rem 0.8rem;margin-bottom:0.8rem;border-radius:6px;background:${bg};color:${fg};font-weight:600">${title}</div>`;
      if (row.bot_health_reason) html += `<div style="color:var(--dim);font-size:0.75rem;margin-bottom:0.6rem">${row.bot_health_reason}</div>`;
    }
    if (row.bot_alternative && row.bot_health !== 'strong') {
      const a = row.bot_alternative;
      html += `<div style="padding:0.6rem 0.8rem;margin-bottom:0.8rem;border-radius:6px;background:rgba(59,130,246,0.12);color:var(--blue);font-size:0.8rem">💡 <strong>Alternative im Shadow:</strong> <a href="#" onclick="showDetailById(${a.id});return false;" style="color:var(--blue);font-weight:600">#${a.id}</a> — +${a.net_pnl}€ in ${a.trades} Trades (OOS PF ${a.oos_pf||'—'})` +
        (a.shared_assets && a.shared_assets.length ? ` · gleiche Assets: ${a.shared_assets.join(', ')}` : '') +
        `<br><span style="color:var(--dim);font-size:0.7rem">Nur ein Hinweis, keine Automatik — Swap-Entscheidung manuell.</span></div>`;
    }
    if (row.description) html += `<div style="color:var(--dim);font-size:0.8rem;margin-bottom:0.8rem">${row.description}</div>`;
    const eqPct = (row.equity - 1000) / 10;
    const gapTxt = row.gap_pct != null ? `<span class="${row.gap_pct>0?'pos':'neg'}">${row.gap_pct}%</span> der OOS-Prognose` : '—';
    const startTxt = row.start_date ? new Date(row.start_date).toLocaleDateString('de-DE') : '?';
    html += '<div class="detail-grid">';
    const sfields = [
      ['ID', '#' + row.id],
      ['Konto', `${row.equity.toFixed(0)}€ (${eqPct>=0?'+':''}${eqPct.toFixed(1)}%)`],
      ['PnL', `<span class="${row.net_pnl>=0?'pos':'neg'}">${row.net_pnl>=0?'+':''}${row.net_pnl.toFixed(2)}€</span>`],
      ['Live Trades', row.trades],
      ['Win Rate', row.trades > 0 ? row.win_rate.toFixed(0) + '%' : '—'],
      ['Trades/Woche', row.shadow_trades_week != null ? row.shadow_trades_week : '—'],
      ['Ø Betrag/Trade', row.shadow_avg_trade != null ? row.shadow_avg_trade + '€' : '—'],
      ['€/Woche', row.pnl_per_week != null ? (row.pnl_per_week>=0?'+':'') + row.pnl_per_week + '€' : '—'],
      ['Gap zu OOS', gapTxt],
      ['Max. Verlustserie', row.max_consec_loss > 3 ? '⚠️ ' + row.max_consec_loss : row.max_consec_loss],
      ['Exits', `🎯 ${row.tp_hits} TP · 🛑 ${row.sl_hits} SL · ⏱ ${row.timeouts} Timeout`],
      ['Kosten', row.costs.toFixed(2) + '€'],
      ['OOS PF (Backtest)', `<span style="color:var(--dim)">${row.oos_pf.toFixed(2)}</span>`],
      ['OOS PnL (Backtest)', `<span style="color:var(--dim)">${row.oos_pnl>=0?'+':''}${row.oos_pnl}€ / ${row.oos_trades} Tr</span>`],
      ['Aktiv seit', `${Math.floor(row.days_active)} Tage (seit ${startTxt})`],
      ['Assets', (row.assets||[]).join(', ') || '—'],
      ['Timeframe', row.timeframe || '1h'],
    ];
    for (const [label, val] of sfields) {
      html += `<div class="detail-item"><div class="detail-label">${label}</div><div class="detail-value">${val}</div></div>`;
    }
    html += '</div>';
  } else {
    // Deploy-Kandidaten: Entscheidungs-Ampel & Details
    const ampel = (row.pf >= 1.25 && row.trades >= 50)
      ? '<div style="padding:0.6rem 0.8rem;margin-bottom:0.8rem;border-radius:6px;background:var(--green-dim);color:var(--green);font-weight:600">🟢 Top-Kandidat: Starker Profit-Faktor bei hoher statistischer Signifikanz</div>'
      : '<div style="padding:0.6rem 0.8rem;margin-bottom:0.8rem;border-radius:6px;background:var(--blue-dim);color:var(--blue);font-weight:600">🟡 Solider Kandidat: Erfüllt Basiskriterien für Shadow-Forward-Test</div>';
    html += ampel;
    html += '<div class="detail-grid">';
    const fields = [
      ['ID', '#' + row.id], ['Score', row.score], ['PF', row.pf || row.best_pf],
      ['PnL', (row.pnl>=0?'+':'') + (row.pnl||row.best_pnl) + '€'],
      ['€/Monat', row.pnl_per_month ? (row.pnl_per_month>0?'+':'') + row.pnl_per_month + '€' : '—'],
      ['Trades/Woche', row.trades_per_week != null ? row.trades_per_week : '—'],
      ['Ø/Trade', row.avg_trade != null ? (row.avg_trade>0?'+':'') + row.avg_trade + '€' : '—'],
      ['Trades', row.trades || row.best_trades], ['Tier', row.tier],
      ['Win Rate', (row.wr||0) + '%'], ['Pass Rate', (row.pass_rate||0) + '%'],
      ['Assets', (row.assets||[]).join(', ')], ['Timeframe', row.timeframe || '1h'],
      ['Source', row.source || row.archetype || '?'], ['Bot', row.bot || '—'],
    ];
    for (const [label, val] of fields) {
      html += `<div class="detail-item"><div class="detail-label">${label}</div><div class="detail-value">${val}</div></div>`;
    }
    html += '</div>';

    // Gates
    if (row.gates) {
      html += '<div style="margin-top:1rem"><strong>Gates:</strong> ';
      for (const [k, v] of Object.entries(row.gates)) {
        if (v === null) continue;
        html += `<span class="gate ${v?'gate-pass':'gate-fail'}">${k.toUpperCase()}: ${v?'✅':'❌'}</span> `;
      }
      html += '</div>';
    }

    // Fire test
    if (row.fire_test !== undefined && row.fire_test !== null) {
      html += `<div style="margin-top:0.5rem"><strong>Feuer-Test:</strong> ${row.fire_test?'✅ Passed':'❌ Failed'}`;
      if (row.signals_per_week) html += ` (${row.signals_per_week} Signale/Woche)`;
      html += '</div>';
    }

    // Hold-Out
    if (row.ho_status) {
      if (row.ho_status === 'passed') html += `<div style="margin-top:0.25rem"><strong>Hold-Out:</strong> ✅ ${(row.ho_pnl>=0?'+':'')+row.ho_pnl}€ / ${row.ho_trades} Trades</div>`;
      else if (row.ho_status === 'warning') html += `<div style="margin-top:0.25rem"><strong>Hold-Out:</strong> ⚠️ ${(row.ho_pnl>=0?'+':'')+row.ho_pnl}€ / ${row.ho_trades} Trades — negativ bei ausreichender Sample-Size</div>`;
      else html += `<div style="margin-top:0.25rem;color:var(--dim)"><strong>Hold-Out:</strong> ➖ ${row.ho_trades||0} Trades — zu wenige für Aussage</div>`;
    }
  }

  // Shadow tab: open positions + closed trade list
  if (currentTab === 'shadow') {
    const fmtDT = ts => new Date(ts*1000).toLocaleString('de-DE', {timeZone:'Europe/Berlin', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    const openPos = ((shadowData && shadowData.open_positions) || []).filter(p => p.id === row.id);
    if (openPos.length > 0) {
      html += `<h3 style="margin-top:1.2rem">📂 Offene Positionen (${openPos.length})</h3>`;
      html += '<table class="sl4-table"><thead><tr><th>Symbol</th><th>Richtung</th><th class="num">Entry</th><th class="num">SL</th><th class="num">TP</th><th>Seit (Berlin)</th></tr></thead><tbody>';
      for (const p of openPos) {
        html += `<tr><td>${p.symbol}</td><td>${p.direction==='long'?'🟢 Long':'🔴 Short'}</td><td class="num">${p.entry}</td><td class="num">${p.sl}</td><td class="num">${p.tp}</td><td>${fmtDT(p.entry_ts)}</td></tr>`;
      }
      html += '</tbody></table>';
    }
    const rts = row.recent_trades || [];
    if (rts.length > 0) {
      html += `<h3 style="margin-top:1.2rem">📜 Shadow-Trades (${rts.length})</h3>`;
      html += '<table class="sl4-table"><thead><tr><th>Exit (Berlin)</th><th>Symbol</th><th>Dir</th><th class="num">Entry</th><th class="num">Exit</th><th>Grund</th><th class="num">Dauer</th><th class="num">PnL</th></tr></thead><tbody>';
      for (const t of rts) {
        const reason = ({sl_hit:'🛑 SL', tp_hit:'🎯 TP', timeout:'⏱ Timeout'})[t.exit_reason] || t.exit_reason;
        const cls = t.net_pnl >= 0 ? 'pos' : 'neg';
        html += `<tr><td>${fmtDT(t.exit_ts)}</td><td>${t.symbol}</td><td>${t.direction==='long'?'🟢 L':'🔴 S'}</td><td class="num">${t.entry}</td><td class="num">${t.exit}</td><td>${reason}</td><td class="num">${t.hold_hours}h</td><td class="num ${cls}" style="font-weight:600">${t.net_pnl>=0?'+':''}${t.net_pnl}€</td></tr>`;
      }
      html += '</tbody></table>';
    } else {
      html += '<div style="margin-top:1.2rem;color:var(--dim)">Noch keine abgeschlossenen Shadow-Trades.</div>';
    }
  }

  m.innerHTML = html;
  document.getElementById('sl4-modal-overlay').classList.add('show');
}

// ── Shadow Dashboard ──
function renderShadowDashboard() {
  try {
  _destroyRdCharts();
  const el = document.getElementById('sl4-content');
  if (!shadowData) { el.innerHTML = '<div class="rd-card">Shadow-Daten laden…</div>'; return; }
  const strats = (shadowData.strategies || []).slice().sort((a,b) => (b.net_pnl||0) - (a.net_pnl||0));
  const openPos = shadowData.open_positions || [];
  const sd = shadowData;
  let html = '';

  // ── Offene Positionen ──
  if (openPos.length > 0) {
    html += '<div class="rd-section-title">📍 Offene Positionen (' + openPos.length + ')</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.6rem;margin-bottom:0.9rem">';
    for (const p of openPos) {
      const dir = (p.direction||'').toLowerCase();
      const dirColor = dir === 'long' ? '#3fb950' : '#f85149';
      const dirIcon = dir === 'long' ? '🟢' : '🔴';
      html += '<div class="rd-card" style="border-left:3px solid '+dirColor+'">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center">';
      html += '<strong>'+esc(p.symbol)+'</strong>';
      html += '<span style="color:'+dirColor+';font-weight:700">'+dirIcon+' '+(dir.toUpperCase())+'</span>';
      html += '</div>';
      html += '<div style="font-size:0.75rem;color:var(--dim);margin-top:0.3rem">';
      html += 'Entry: <strong>'+(p.entry||p.entry_price||'—')+'</strong>';
      html += ' · SL: <span style="color:var(--red)">'+(p.sl||'—')+'</span>';
      html += ' · TP: <span style="color:var(--green)">'+(p.tp||'—')+'</span>';
      if (p.volume) html += ' · Vol: '+(p.volume/100000).toFixed(1)+' lot';
      html += '</div>';
      html += '</div>';
    }
    html += '</div>';
  }

  // ── KPI Row ──
  const totalPnl = strats.reduce((s,x) => s + (x.net_pnl||0), 0);
  const profitable = strats.filter(x => (x.net_pnl||0) > 0).length;
  const losing = strats.filter(x => (x.net_pnl||0) < 0).length;
  const noTrades = strats.filter(x => (x.trades||0) === 0).length;
  const totalTrades = strats.reduce((s,x) => s + (x.trades||0), 0);
  const avgWr = strats.filter(x => x.trades > 0).reduce((s,x) => s + (x.win_rate||0), 0) / Math.max(strats.filter(x => x.trades > 0).length, 1);
  const deployReady = strats.filter(x => x.shadow_flag === 'deploy_ready').length;
  const strongBots = strats.filter(x => x.bot_health === 'strong').length;
  html += '<div class="rd-kpi">';
  html += '<div class="rd-kpi-card"><div class="rd-kpi-val" style="color:'+(totalPnl>=0?'var(--green)':'var(--red)')+'">'+(totalPnl>=0?'+':'')+totalPnl.toFixed(0)+'€</div><div class="rd-kpi-label">Gesamt PnL</div></div>';
  html += '<div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--green)">'+profitable+'</div><div class="rd-kpi-label">Profitabel</div></div>';
  html += '<div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--red)">'+losing+'</div><div class="rd-kpi-label">Verlust</div></div>';
  html += '<div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--blue)">'+totalTrades+'</div><div class="rd-kpi-label">Trades</div></div>';
  html += '<div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--yellow)">'+avgWr.toFixed(0)+'%</div><div class="rd-kpi-label">Ø Win Rate</div></div>';
  html += '<div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--green)">'+deployReady+'</div><div class="rd-kpi-label">Deploy-Ready</div></div>';
  html += '<div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--purple)">'+strongBots+'</div><div class="rd-kpi-label">Bot Strong</div></div>';
  html += '</div>';

  // ── Charts Grid ──
  html += '<div class="rd-grid">';

  // 1) Strategie-Ranking nach PnL
  html += '<div class="rd-card rd-grid-wide"><h3>📊 Strategie-Ranking nach PnL</h3><div class="rd-chart-wrap h300"><canvas id="sh-pnl-rank"></canvas></div></div>';

  // 2) Asset-Ranking nach PnL
  html += '<div class="rd-card"><h3>💰 Asset-Ranking nach PnL</h3><div class="rd-chart-wrap h250"><canvas id="sh-asset-pnl"></canvas></div></div>';

  // 3) PnL-Split Donut
  html += '<div class="rd-card"><h3>📉 PnL-Verteilung</h3><div class="rd-chart-wrap h250"><canvas id="sh-pnl-split"></canvas></div></div>';

  // 4) Bot Health Donut
  html += '<div class="rd-card"><h3>🤖 Bot Health</h3><div class="rd-chart-wrap h250"><canvas id="sh-bot-health"></canvas></div></div>';

  // 5) Shadow vs OOS Gap
  html += '<div class="rd-card rd-grid-wide"><h3>📏 Shadow vs OOS Gap — Erwartung vs Realität</h3><div class="rd-chart-wrap h280"><canvas id="sh-gap"></canvas></div></div>';

  // 6) Win Rate Verteilung
  html += '<div class="rd-card"><h3>🎯 Win Rate Verteilung</h3><div class="rd-chart-wrap h250"><canvas id="sh-wr-dist"></canvas></div></div>';

  // 7) Asset Coverage
  html += '<div class="rd-card"><h3>🗺️ Asset Coverage (Trades)</h3><div class="rd-chart-wrap h250"><canvas id="sh-asset-cov"></canvas></div></div>';

  // 8) Strategie-Quelle
  html += '<div class="rd-card"><h3>🧬 Strategie-Quelle</h3><div class="rd-chart-wrap h250"><canvas id="sh-source"></canvas></div></div>';

  // 9) Days Active vs PnL
  html += '<div class="rd-card"><h3>⏱️ Alter vs PnL</h3><div class="rd-chart-wrap h250"><canvas id="sh-age-pnl"></canvas></div></div>';

  // 10) Ø PnL pro Trade
  html += '<div class="rd-card rd-grid-wide"><h3>💹 Ø PnL/Trade nach Strategie</h3><div class="rd-chart-wrap h250"><canvas id="sh-avg-trade"></canvas></div></div>';

  // 11) Exit-Analyse
  html += '<div class="rd-card"><h3>🚪 Exit-Analyse (TP/SL/Timeout)</h3><div class="rd-chart-wrap h250"><canvas id="sh-exits"></canvas></div></div>';

  // 12) Margin-Risiko
  html += '<div class="rd-card"><h3>⚖️ Margin-Auslastung</h3><div class="rd-chart-wrap h280"><canvas id="sh-margin"></canvas></div></div>';

  html += '</div>'; // close rd-grid

  // ── Deployed Bots (echte Konten) ──
  const deployed = strats.filter(s => s.deployed_instance);
  if (deployed.length > 0) {
    html += '<div class="rd-section-title">🤖 Deployed Bots (Echtgeld/Demo)</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.6rem;margin-bottom:0.9rem">';
    for (const s of deployed.sort((a,b) => (b.net_pnl||0)-(a.net_pnl||0))) {
      const pnl = s.net_pnl||0;
      const pnlColor = pnl>=0 ? '#3fb950' : '#f85149';
      const botLabel = (s.deployed_instance||'').replace(/@\w+/,'') || '#'+s.id;
      const botName = (s.name||'').slice(0,30);
      html += '<div class="rd-card" style="border-left:3px solid '+pnlColor+'">';
      html += '<div style="display:flex;justify-content:space-between"><strong>'+esc(botLabel)+'</strong>';
      html += '<span style="color:'+pnlColor+';font-weight:700">'+(pnl>=0?'+':'')+pnl.toFixed(2)+'€</span></div>';
      html += '<div style="font-size:0.72rem;color:var(--dim);margin-top:0.2rem">'+esc(botName)+'</div>';
      html += '<div style="font-size:0.72rem;color:var(--dim);margin-top:0.2rem">';
      html += (s.trades||0)+' Tr · WR '+(s.win_rate||0).toFixed(0)+'% · Ø Margin '+(s.avg_margin_utilization_pct||0).toFixed(0)+'%';
      html += '</div></div>';
    }
    html += '</div>';
  }

  // ── Auffälligkeiten & Insights ──
  html += '<div class="rd-section-title">⚡ Auffälligkeiten & Insights</div>';
  html += '<div class="rd-card"><div style="display:flex;flex-direction:column;gap:0.5rem;font-size:0.82rem">';

  // Insight 1: Margin-Warnung
  const highMargin = active.filter(s => (s.avg_margin_utilization_pct||0) > 70);
  if (highMargin.length > 0) {
    html += '<div>🔴 <strong>Hohes Margin-Risiko:</strong> '+highMargin.length+' Strategien nutzen >70% Margin: '
      + highMargin.map(s => '#'+s.id).join(', ') + ' — bei Drawdown schnell Margin-Call.</div>';
  }

  // Insight 2: SL-Dominanz
  const totalSL = strats.reduce((s,x) => s + (x.sl_hits||0), 0);
  const totalTP = strats.reduce((s,x) => s + (x.tp_hits||0), 0);
  const totalTO = strats.reduce((s,x) => s + (x.timeouts||0), 0);
  if (totalSL > totalTP) {
    html += '<div>🟡 <strong>SL-dominiert:</strong> '+totalSL+' SL-Hits vs '+totalTP+' TP-Hits ('+totalTO+' Timeouts). ';
    html += 'SL:TP Ratio = 1:'+(totalTP/Math.max(totalSL,1)).toFixed(2)+'. ';
    html += (totalSL > totalTP*1.5 ? 'Deutlich mehr Verluste als Gewinne — SL-Platzierung prüfen.' : 'Leicht SL-lastig.')+'</div>';
  }

  // Insight 3: Beste Strategie
  const best = active.reduce((a,b) => (a.net_pnl||0) > (b.net_pnl||0) ? a : b, {});
  if (best.id) {
    html += '<div>🟢 <strong>Bester Performer:</strong> #'+best.id+' '+(best.name||'').slice(0,35)
      + ' — +'+(best.net_pnl||0).toFixed(2)+'€ in '+(best.trades||0)+' Trades (WR '+(best.win_rate||0).toFixed(0)+'%)</div>';
  }

  // Insight 4: Schlechtester
  const worst = active.reduce((a,b) => (a.net_pnl||0) < (b.net_pnl||0) ? a : b, {});
  if (worst.id && (worst.net_pnl||0) < -20) {
    html += '<div>🔴 <strong>Schlechtester:</strong> #'+worst.id+' '+(worst.name||'').slice(0,35)
      + ' — '+(worst.net_pnl||0).toFixed(2)+'€. Gap: '+(worst.gap_pct||0).toFixed(0)+'% zu OOS.</div>';
  }

  // Insight 5: Consecutive Loss Warnung
  const highConsec = active.filter(s => (s.max_consec_loss||0) >= 6);
  if (highConsec.length > 0) {
    html += '<div>🟡 <strong>Hohe Verlustserien:</strong> '
      + highConsec.map(s => '#'+s.id+' ('+s.max_consec_loss+'×)').join(', ')
      + ' — psychologisch belastend, Strategie-Edge prüfen.</div>';
  }

  // Insight 6: Metalle vs FX
  const metStrats = active.filter(s => (s.assets||[]).some(a => a.includes('XAU') || a.includes('XAG')));
  const fxStrats = active.filter(s => (s.assets||[]).every(a => !a.includes('XAU') && !a.includes('XAG')));
  const metPnl = metStrats.reduce((s,x) => s+(x.net_pnl||0), 0);
  const fxPnl = fxStrats.reduce((s,x) => s+(x.net_pnl||0), 0);
  html += '<div>📊 <strong>Asset-Klassen:</strong> Metalle: '+(metPnl>=0?'+':'')+metPnl.toFixed(0)+'€ ('+metStrats.length+' Strats) · FX: '+(fxPnl>=0?'+':'')+fxPnl.toFixed(0)+'€ ('+fxStrats.length+' Strats)</div>';

  html += '</div></div>';

  // ── Strategy Table ──
  html += '<div class="rd-section-title">📋 Alle Shadow-Strategien ('+strats.length+')</div>';
  html += '<div class="rd-card" style="overflow-x:auto"><table class="sl4-table"><thead><tr>';
  html += '<th>#</th><th>Strategie</th><th>Assets</th><th class="num">Tage</th><th class="num">PnL</th><th class="num">Trades</th><th class="num">WR</th><th class="num">Ø€/Tr</th><th class="num">€/Wk</th><th class="num">OOS PF</th><th class="num">Gap</th><th>Health</th>';
  html += '</tr></thead><tbody>';
  for (const s of strats) {
    const pnlCls = (s.net_pnl||0) >= 0 ? 'pos' : 'neg';
    const gapCls = (s.gap_pct||0) >= 0 ? 'pos' : 'neg';
    const bhMap = {strong:'🟢', ok:'🟡', weak:'🔴', new:'⚪'};
    html += '<tr onclick="showDetail('+JSON.stringify(s).replace(/"/g,'&quot;')+')">';
    html += '<td><strong>#'+s.id+'</strong>'+(s.shadow_flag==='deploy_ready'?' 🚀':'')+'</td>';
    html += '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(s.name)+'">'+esc((s.name||'').slice(0,35))+'</td>';
    html += '<td style="font-size:0.7rem">'+(s.assets||[]).join(', ')+'</td>';
    html += '<td class="num">'+(s.days_active?Math.floor(s.days_active)+'d':'—')+'</td>';
    html += '<td class="num"><span class="'+pnlCls+'" style="font-weight:600">'+((s.net_pnl||0)>=0?'+':'')+(s.net_pnl||0).toFixed(2)+'€</span></td>';
    html += '<td class="num">'+((s.trades||0)>0?s.trades:'—')+'</td>';
    html += '<td class="num">'+((s.trades||0)>0?(s.win_rate||0).toFixed(0)+'%':'—')+'</td>';
    html += '<td class="num">'+(s.shadow_avg_trade!=null?s.shadow_avg_trade+'€':'—')+'</td>';
    html += '<td class="num">'+(s.pnl_per_week!=null?'<span class="'+((s.pnl_per_week>=0)?'pos':'neg')+'">'+((s.pnl_per_week>=0)?'+':'')+s.pnl_per_week+'€</span>':'—')+'</td>';
    html += '<td class="num" style="color:var(--dim)">'+(s.oos_pf!=null?s.oos_pf.toFixed(2):'—')+'</td>';
    html += '<td class="num"><span class="'+gapCls+'">'+(s.gap_pct!=null?((s.gap_pct>=0)?'+':'')+s.gap_pct+'%':'—')+'</span></td>';
    html += '<td>'+(bhMap[s.bot_health]||'—')+'</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';

  el.innerHTML = html;

  // ═══════════════════════════════════
  // Render Charts
  // ═══════════════════════════════════
  const active = strats.filter(s => (s.trades||0) > 0);

  // 1) Strategie-Ranking nach PnL (Horizontal Bar)
  const sorted = active.slice().sort((a,b) => (a.net_pnl||0) - (b.net_pnl||0));
  _mkBar('sh-pnl-rank',
    sorted.map(s => '#'+s.id+' '+(s.name||'').slice(0,20)),
    [{ label: 'PnL €', data: sorted.map(s => s.net_pnl||0),
       backgroundColor: sorted.map(s => (s.net_pnl||0)>=0 ? 'rgba(63,185,80,0.7)' : 'rgba(248,81,73,0.7)') }],
    { horizontal: true });

  // 2) Asset-Ranking nach PnL
  const assetMap = {};
  for (const s of active) {
    for (const a of (s.assets||[])) {
      if (!assetMap[a]) assetMap[a] = {pnl:0, trades:0};
      assetMap[a].pnl += (s.net_pnl||0);
      assetMap[a].trades += (s.trades||0);
    }
  }
  const assetList = Object.entries(assetMap).sort((a,b) => b[1].pnl - a[1].pnl);
  _mkBar('sh-asset-pnl',
    assetList.map(a => a[0]),
    [{ label: 'PnL €', data: assetList.map(a => a[1].pnl),
       backgroundColor: assetList.map(a => a[1].pnl>=0 ? 'rgba(63,185,80,0.7)' : 'rgba(248,81,73,0.7)') }],
    { horizontal: true });

  // 3) PnL-Split Donut
  _mkDoughnut('sh-pnl-split',
    ['Profitabel','Verlust','Kein Trade'],
    [profitable, losing, noTrades],
    ['#3fb950','#f85149','#7d8590'],
    strats.length.toString(), 'Strategien');

  // 4) Bot Health Donut
  const bhCounts = {};
  for (const s of strats) { const h = s.bot_health||'none'; bhCounts[h] = (bhCounts[h]||0)+1; }
  const bhLabels = ['strong','ok','none'];
  const bhColors = ['#3fb950','#d29922','#7d8590'];
  _mkDoughnut('sh-bot-health',
    bhLabels.map(l => l==='none'?'Keine Instanz':l),
    bhLabels.map(l => bhCounts[l]||0),
    bhColors, strongBots.toString(), 'Strong');

  // 5) Shadow vs OOS Gap (Horizontal Bar)
  const withGap = active.filter(s => s.gap_pct != null).sort((a,b) => (a.gap_pct||0) - (b.gap_pct||0));
  if (withGap.length > 0) {
    _mkBar('sh-gap',
      withGap.map(s => '#'+s.id+' '+(s.name||'').slice(0,18)),
      [{ label: 'Gap %', data: withGap.map(s => s.gap_pct||0),
         backgroundColor: withGap.map(s => (s.gap_pct||0)>=0 ? 'rgba(63,185,80,0.7)' : 'rgba(248,81,73,0.7)') }],
      { horizontal: true });
  }

  // 6) Win Rate Verteilung (Bar)
  const wrBuckets = {'0%':0, '1-25%':0, '26-40%':0, '41-50%':0, '51-65%':0, '66-80%':0, '81-100%':0};
  for (const s of active) {
    const wr = s.win_rate||0;
    if (wr===0) wrBuckets['0%']++;
    else if (wr<=25) wrBuckets['1-25%']++;
    else if (wr<=40) wrBuckets['26-40%']++;
    else if (wr<=50) wrBuckets['41-50%']++;
    else if (wr<=65) wrBuckets['51-65%']++;
    else if (wr<=80) wrBuckets['66-80%']++;
    else wrBuckets['81-100%']++;
  }
  _mkBar('sh-wr-dist',
    Object.keys(wrBuckets),
    [{ label: 'Strategien', data: Object.values(wrBuckets), backgroundColor: 'rgba(88,166,255,0.7)' }]);

  // 7) Asset Coverage (Horizontal Bar — Trade Count)
  const assetTrades = Object.entries(assetMap).sort((a,b) => b[1].trades - a[1].trades);
  _mkBar('sh-asset-cov',
    assetTrades.map(a => a[0]),
    [{ label: 'Trades', data: assetTrades.map(a => a[1].trades), backgroundColor: 'rgba(188,140,255,0.7)' }],
    { horizontal: true });

  // 8) Strategie-Quelle Donut
  const srcMap = {};
  for (const s of strats) {
    const n = s.name||'';
    let src = 'Other';
    if (n.startsWith('RCP-CLUSTER')) src = 'RCP-Cluster';
    else if (n.startsWith('RCP-RECIPE')) src = 'RCP-Recipe';
    else if (n.startsWith('Kimi') || n.startsWith('kimi')) src = 'Kimi/Event';
    else if (n.startsWith('RV:')) src = 'Ratio-Value';
    srcMap[src] = (srcMap[src]||0)+1;
  }
  const srcLabels = Object.keys(srcMap);
  const srcColors = ['#58a6ff','#3fb950','#d29922','#bc8cff','#7d8590'];
  _mkDoughnut('sh-source', srcLabels, Object.values(srcMap), srcColors.slice(0,srcLabels.length), '');

  // 9) Days Active vs PnL (Scatter → Bar by age bucket)
  const ageBuckets = {'<7d':[], '7-14d':[], '14-30d':[], '30+d':[]};
  for (const s of active) {
    const d = s.days_active||0;
    const pnl = s.net_pnl||0;
    if (d<7) ageBuckets['<7d'].push(pnl);
    else if (d<14) ageBuckets['7-14d'].push(pnl);
    else if (d<30) ageBuckets['14-30d'].push(pnl);
    else ageBuckets['30+d'].push(pnl);
  }
  const ageLabels = Object.keys(ageBuckets);
  const ageAvg = ageLabels.map(k => { const arr = ageBuckets[k]; return arr.length > 0 ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; });
  const ageCnt = ageLabels.map(k => ageBuckets[k].length);
  _mkBar('sh-age-pnl', ageLabels,
    [
      { label: 'Ø PnL €', data: ageAvg, backgroundColor: ageAvg.map(v => v>=0?'rgba(63,185,80,0.7)':'rgba(248,81,73,0.7)') }
    ]);

  // 10) Ø PnL pro Trade (Horizontal Bar)
  const withAvgTrade = active.filter(s => (s.trades||0) > 0).map(s => ({
    id: s.id, name: s.name, avg: (s.net_pnl||0) / (s.trades||1)
  })).sort((a,b) => a.avg - b.avg);
  _mkBar('sh-avg-trade',
    withAvgTrade.map(s => '#'+s.id+' '+(s.name||'').slice(0,20)),
    [{ label: 'Ø PnL/Trade €', data: withAvgTrade.map(s => Math.round(s.avg*100)/100),
       backgroundColor: withAvgTrade.map(s => s.avg>=0 ? 'rgba(63,185,80,0.7)' : 'rgba(248,81,73,0.7)') }],
    { horizontal: true });

  // 11) Exit-Analyse Donut
  const totalSL2 = strats.reduce((s,x) => s + (x.sl_hits||0), 0);
  const totalTP2 = strats.reduce((s,x) => s + (x.tp_hits||0), 0);
  const totalTO2 = strats.reduce((s,x) => s + (x.timeouts||0), 0);
  _mkDoughnut('sh-exits',
    ['TP-Hits','SL-Hits','Timeout'],
    [totalTP2, totalSL2, totalTO2],
    ['#3fb950','#f85149','#d29922'],
    (totalTP2+totalSL2+totalTO2).toString(), 'Exits');

  // 12) Margin-Auslastung (Horizontal Bar)
  const withMargin = active.filter(s => (s.avg_margin_utilization_pct||0) > 0)
    .sort((a,b) => (a.avg_margin_utilization_pct||0) - (b.avg_margin_utilization_pct||0));
  if (withMargin.length > 0) {
    _mkBar('sh-margin',
      withMargin.map(s => '#'+s.id+' '+(s.name||'').slice(0,18)),
      [{ label: 'Ø Margin %', data: withMargin.map(s => s.avg_margin_utilization_pct||0),
         backgroundColor: withMargin.map(s => {
           const m = s.avg_margin_utilization_pct||0;
           return m > 70 ? 'rgba(248,81,73,0.7)' : m > 40 ? 'rgba(210,153,34,0.7)' : 'rgba(63,185,80,0.7)';
         }) }],
      { horizontal: true });
  } catch(shErr) {
    const el = document.getElementById('sl4-content');
    if (el) el.innerHTML = '<div class="rd-card" style="color:var(--red)">⚠️ Shadow Dashboard Fehler: ' + esc(shErr.message || shErr) + '</div>';
    console.error('renderShadowDashboard error:', shErr);
  }
}

// ── R&D Dashboard Charts ──
let _rdCharts = [];
function _destroyRdCharts() {
  for (const c of _rdCharts) { try { c.destroy(); } catch(e) {} }
  _rdCharts = [];
}
const _centerTextPlugin = {
  id: 'rdCenterText',
  afterDraw(chart) {
    if (!chart.config.options.plugins || !chart.config.options.plugins.rdCenterText) return;
    const {ctx, chartArea: {top, bottom, left, right}} = chart;
    const cfg = chart.config.options.plugins.rdCenterText;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const cx = (left + right) / 2, cy = (top + bottom) / 2;
    ctx.font = 'bold 1.1rem sans-serif'; ctx.fillStyle = '#e6edf3';
    ctx.fillText(cfg.text || '', cx, cy - 7);
    if (cfg.sub) { ctx.font = '0.6rem sans-serif'; ctx.fillStyle = '#7d8590'; ctx.fillText(cfg.sub, cx, cy + 12); }
    ctx.restore();
  }
};
try { Chart.register(_centerTextPlugin); } catch(e) {}

function _mkDoughnut(canvasId, labels, data, colors, centerText, centerSub) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '60%',
      plugins: {
        legend: { position: 'bottom', labels: { color: '#7d8590', font: { size: 11 }, padding: 10, boxWidth: 10 } },
        tooltip: { callbacks: { label: t => t.label + ': ' + t.raw } },
        rdCenterText: { text: centerText, sub: centerSub }
      }
    }
  });
  _rdCharts.push(chart);
  return chart;
}

function _mkBar(canvasId, labels, datasets, opts) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const stacked = opts && opts.stacked;
  const horiz = opts && opts.horizontal;
  const chartType = horiz ? 'bar' : 'bar';
  const chart = new Chart(ctx, {
    type: chartType,
    data: { labels, datasets },
    options: {
      indexAxis: horiz ? 'y' : 'x',
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { stacked, ticks: { color: '#7d8590', font: { size: 10 } }, grid: { color: 'rgba(48,54,61,0.4)' } },
        y: { stacked, ticks: { color: '#7d8590', font: { size: 10 } }, grid: { color: 'rgba(48,54,61,0.4)' } }
      },
      plugins: {
        legend: { display: datasets.length > 1, position: 'top', labels: { color: '#7d8590', font: { size: 11 }, boxWidth: 10 } },
        tooltip: {}
      }
    }
  });
  _rdCharts.push(chart);
  return chart;
}

      const icon = cls === 'Metalle' ? '🪙' : '💱';
      html += `<div class="rd-card" style="border-left:3px solid ${clsColor}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
          <div><span style="font-size:1rem">${icon}</span> <strong style="color:${clsColor}">${esc(ck)}</strong></div>
          <span class="rd-pill ${succRate>50?'ok':succRate>0?'warn':'dim'}">${cStats.runs} Zyklen · ${succRate}% ✅</span>
        </div>
        <div style="font-size:0.78rem;color:var(--dim);margin-bottom:0.4rem">${esc(c.note||'')}</div>
        <div style="display:flex;gap:0.8rem;flex-wrap:wrap;font-size:0.72rem">
          <span><strong>Assets:</strong> ${(c.assets||[]).join(', ')}</span>
          <span><strong>TF:</strong> ${(c.timeframes||[]).join(', ')}</span>
          <span><strong>Komm:</strong> ${cls==='Metalle'?'0€':'6€/100k'}</span>
        </div>
        <div style="margin-top:0.4rem;font-size:0.7rem;color:var(--dim)">
          <strong>Approaches:</strong> ${(c.strategy_approaches||[]).map(a => {
            const used = (cStats.approaches||[]).includes(a);
            return '<span style="color:'+(used?'var(--green)':'var(--dim)')+';margin-right:0.5rem">'+(used?'✅':'⬜')+' '+esc(a)+'</span>';
          }).join('')}
        </div>
      </div>`;
    }
    html += '</div>';
  }

  // ── KPI Row ──
  const sf = ch.strategy_funnel || {};

  const totalStrat = Object.values(sf).reduce((a,b)=>a+b, 0);
  const validated = sf.validated || 0;
  const completed = rp.completed || 0;
  const totalRecipes = Object.values(rp).reduce((a,b)=>a+b, 0);
  const yieldPct = totalStrat > 0 ? (validated / totalStrat * 100).toFixed(1) : '0';
  const comboRows = rdData.charts && rdData.charts.recipe_pipeline ? null : null; // placeholder
  html += `<div class="rd-kpi">
    <div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--blue)">${totalStrat}</div><div class="rd-kpi-label">Strategien</div></div>
    <div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--green)">${validated}</div><div class="rd-kpi-label">Validated</div></div>
    <div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--green)">${yieldPct}%</div><div class="rd-kpi-label">Tier-A Yield</div></div>
    <div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--yellow)">${completed}</div><div class="rd-kpi-label">Recipes done</div></div>
    <div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--purple)">${totalRes}</div><div class="rd-kpi-label">Asset-Tests</div></div>
    <div class="rd-kpi-card"><div class="rd-kpi-val" style="color:var(--blue)">${today.length}</div><div class="rd-kpi-label">Heute</div></div>
  </div>`;

  // ── Weekly Focus Shift (wenn Worker-Fokus wechselt) ──
  if (ch.weekly_focus && ch.weekly_focus.length > 0) {
    const wf = ch.weekly_focus;
    html += `<div class="rd-section-title">📊 Wochen-Fokus — Worker-Gewichtung</div>`;
    html += `<div class="rd-card rd-grid-wide"><div class="rd-chart-wrap h280"><canvas id="rd-focus-shift"></canvas></div></div>`;
  }

  // ── Charts Grid ──
  html += `<div class="rd-grid">`;

  // A) Strategie-Funnel
  if (ch.strategy_funnel) {
    html += `<div class="rd-card"><h3>📉 Strategie-Funnel</h3><div class="rd-chart-wrap h250"><canvas id="rd-funnel"></canvas></div></div>`;
  }
  // B) Recipe-Pipeline
  if (ch.recipe_pipeline) {
    html += `<div class="rd-card"><h3>🧪 Recipe-Pipeline</h3><div class="rd-chart-wrap h250"><canvas id="rd-recipe"></canvas></div></div>`;
  }
  // C) Asset-Abdeckung
  if (ch.avg_pf_by_class) {
    html += `<div class="rd-card"><h3>🎯 Asset-Abdeckung</h3><div class="rd-chart-wrap h250"><canvas id="rd-asset"></canvas></div></div>`;
  }
  // D) Tier pro Asset-Klasse
  if (ch.tier_by_class) {
    html += `<div class="rd-card"><h3>🏅 Tier-Verteilung</h3><div class="rd-chart-wrap h250"><canvas id="rd-tier"></canvas></div></div>`;
  }
  // E) Cluster-Aufmerksamkeit
  if (ch.cluster_attention && ch.cluster_attention.length > 0) {
    html += `<div class="rd-card"><h3>🗂️ Cluster-Aufmerksamkeit (Top 15)</h3><div class="rd-chart-wrap h300"><canvas id="rd-cluster-att"></canvas></div></div>`;
  }
  // F) Source-Verteilung
  if (ch.source_breakdown) {
    html += `<div class="rd-card"><h3>🧬 Source-Verteilung</h3><div class="rd-chart-wrap h250"><canvas id="rd-source"></canvas></div></div>`;
  }
  // G) Cluster Performance
  if (ch.top_cluster_perf && ch.top_cluster_perf.length > 0) {
    html += `<div class="rd-card"><h3>🏆 Top Cluster nach Ø Score</h3><div class="rd-chart-wrap h300"><canvas id="rd-cluster-perf"></canvas></div></div>`;
  }
  // H) Symbol Coverage
  if (ch.symbol_coverage) {
    html += `<div class="rd-card"><h3>📊 Symbole nach Coverage</h3><div class="rd-chart-wrap h300"><canvas id="rd-symbols"></canvas></div></div>`;
  }
  // I) Tägliche Produktion
  if (ch.daily_production && ch.daily_production.length > 0) {
    html += `<div class="rd-card rd-grid-wide"><h3>📈 Tägliche Produktion (30d)</h3><div class="rd-chart-wrap h200"><canvas id="rd-daily"></canvas></div></div>`;
  }

  html += '</div>'; // close rd-grid

  // ── PHASEN-MARKER ──
  if (ch.weekly_focus && ch.weekly_focus.length > 0) {
    const wf = ch.weekly_focus;
    const focusStartWeek = '2026-W37';
    const focusIdx = wf.findIndex(w => w.week === focusStartWeek);
    if (focusIdx >= 0) {
      html += `<div class="rd-card" style="background:rgba(88,166,255,0.06);border-color:var(--blue);font-size:0.8rem">
        📍 <strong>Phasen-Wechsel:</strong> Ab <span style="color:var(--blue)">${focusStartWeek}</span> — Fokus von breiter Exploration auf <strong>2 sortenreine Cluster</strong> umgestellt
        (Metalle 0€ Komm + FX 10-Basket H4). Davor: ${wf.slice(0, focusIdx).reduce((s,w)=>s+w.FX+w.Indizes+w.Metalle,0)} Strategien über ${focusIdx} Wochen breit getestet.
      </div>`;
    }
  }

  // ── Was fehlt ──
  const sc = ch.symbol_coverage || [];
  const underTest = sc.filter(s => s.count < 5);
  const fkAll = {};
  for (const ck of fkKeys) {
    for (const a of (fkClusters[ck].assets||[])) { fkAll[a] = ck; }
  }
  const fokusUntested = Object.keys(fkAll).filter(s => !sc.find(x => x.symbol === s));
  if (underTest.length > 0 || fokusUntested.length > 0) {
    html += `<div class="rd-section-title">🔍 Was fehlt — Coverage-Lücken</div>`;
    html += '<div class="rd-card">';
    if (underTest.length > 0) {
      html += '<div style="font-size:0.78rem;margin-bottom:0.5rem"><strong>Symbole mit &lt;5 Tests:</strong> ';
      html += underTest.map(s => {
        const inFokus = fkAll[s.symbol];
        return '<span style="color:'+(inFokus?'var(--yellow)':'var(--dim)')+';margin-right:0.4rem">'
          +esc(s.symbol)+' ('+s.count+')'
          +(inFokus?' ⚠️':'')+'</span>';
      }).join('');
      html += '</div>';
    }
    if (fokusUntested.length > 0) {
      html += '<div style="font-size:0.78rem"><span style="color:var(--yellow)">⚠️</span> <strong>FOKUS-Assets ohne Asset-Result:</strong> '
        + fokusUntested.map(s => '<span style="color:var(--yellow);margin-right:0.4rem">'+esc(s)+'</span>').join('')
        + ' — Diese Assets sind im aktuellen FOKUS konfiguriert, haben aber noch keine WFO-Ergebnisse.</div>';
    }
    html += '</div>';
  }

  // ── Heutige Produktion (Tabelle) ──
  html += `<div class="rd-section-title">📅 Heutige Produktion (${today.length})</div>`;
  html += '<div class="rd-card">';
  if (today.length === 0) { html += '<div style="color:var(--dim);font-size:0.8rem">Heute noch keine neuen Strategien.</div>'; }
  else {
    html += '<table class="sl4-table"><thead><tr><th>#</th><th>Strategie</th><th>Status</th><th class="num">PF</th><th class="num">Trades</th><th>Tier</th></tr></thead><tbody>';
    for (const s of today) {
      const stCls = {validated:'rd-pill ok', candidate:'rd-pill warn', rejected:'rd-pill bad'}[s.status] || 'rd-pill dim';
      const tierCls = {A:'rd-pill ok', B:'rd-pill warn', C:'rd-pill bad'}[s.tier] || 'rd-pill dim';
      html += `<tr><td>#${s.id}</td><td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(s.name)}">${esc(s.name)}</td>
        <td><span class="${stCls}">${s.status}</span></td>
        <td class="num">${s.pf != null ? s.pf : '—'}</td>
        <td class="num">${s.trades != null ? s.trades : '—'}</td>
        <td>${s.tier ? '<span class="'+tierCls+'">'+s.tier+'</span>' : '—'}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '</div>';

  // ── Cluster-Fortschritt ──
  const openList = cl.open || [];
  html += `<div class="rd-section-title">🗂️ Cluster-Fortschritt (${cl.total})</div>`;
  html += '<div class="rd-card"><div class="rd-cluster-grid">';
  for (const c of cl.done) html += '<span class="rd-cluster-chip done" title="Strategie gespeichert">✅ '+c+'</span>';
  for (const c of (cl.cooldown||[])) html += '<span class="rd-cluster-chip cool" title="Cooldown bis '+(c.saved_ts||'?')+' (→ #'+(c.strategy_id||'?')+')">⏳ '+c.name+'</span>';
  for (const c of openList) html += '<span class="rd-cluster-chip open">'+c+'</span>';
  if (cl.done.length + (cl.cooldown||[]).length + openList.length === 0) html += '<span style="color:var(--dim);font-size:0.8rem">keine Cluster-Daten</span>';
  html += '</div></div>';

  // ── Letzte Zyklen ──
  html += `<div class="rd-section-title">🕐 Letzte Zyklen</div>`;
  html += '<div class="rd-card"><div class="rd-timeline">';
  if (cycles.length === 0) { html += '<span style="color:var(--dim);font-size:0.8rem">keine Zyklen erfasst</span>'; }
  for (const cy of cycles) {
    const resCls = cy.result && cy.result.includes('Strategie') ? 'rd-pill ok'
      : (cy.result && cy.result.includes('Duplicate') ? 'rd-pill warn' : 'rd-pill bad');
    html += '<div class="rd-tl-row"><span class="rd-tl-cluster">'+esc(cy.cluster||'?')+'</span><span class="rd-tl-result">'
      +(cy.approach ? esc(cy.approach)+' · ' : '')
      +(cy.result ? '<span class="'+resCls+'">'+esc(cy.result)+'</span>' : '<span class="rd-pill dim">läuft…</span>')
      +'</span></div>';
  }
  html += '</div></div>';

  // ── Approach-Blacklist ──
  html += `<div class="rd-section-title">🚫 Approach-Blacklist (${bl.length})</div>`;
  html += '<div class="rd-card">';
  if (bl.length === 0) { html += '<div style="color:var(--dim);font-size:0.8rem">Keine blacklisteten Approaches.</div>'; }
  else {
    html += '<table class="sl4-table"><thead><tr><th>Approach</th><th class="num">Count</th><th>Grund</th><th>Zuletzt</th></tr></thead><tbody>';
    for (const b of bl) {
      const when = b.last_rejected ? new Date(b.last_rejected).toLocaleDateString('de-DE') + ' ' + new Date(b.last_rejected).toLocaleTimeString('de-DE') : '—';
      html += '<tr><td>'+esc(b.approach)+'</td><td class="num">'+(b.count != null ? b.count : '—')+'</td>'
        +'<td>'+(b.reason ? esc(b.reason) : '3× Rejection')+'</td><td style="color:var(--dim)">'+when+'</td></tr>';
    }
    html += '</tbody></table>';
  }
  html += '</div>';

  el.innerHTML = html;

  // ═══════════════════════════════════
  // Render Charts (after DOM is ready)
  // ═══════════════════════════════════

  // A) Strategie-Funnel (Doughnut)
  if (ch.strategy_funnel) {
    const sf = ch.strategy_funnel;
    const order = ['validated','candidate','archived','rejected','invalidated'];
    const colors = ['#3fb950','#58a6ff','#7d8590','#f85149','#d29922'];
    const vals = order.map(k => sf[k] || 0);
    const total = vals.reduce((a,b)=>a+b,0);
    _mkDoughnut('rd-funnel', order, vals, colors, total.toString(), 'Total');
  }

  // B) Recipe-Pipeline (Doughnut)
  if (ch.recipe_pipeline) {
    const rp = ch.recipe_pipeline;
    const rpOrd = ['completed','pending','failed','cancelled'];
    const rpC = ['#3fb950','#58a6ff','#f85149','#7d8590'];
    const rpV = rpOrd.map(k => rp[k] || 0);
    const rpT = rpV.reduce((a,b)=>a+b,0);
    _mkDoughnut('rd-recipe', rpOrd, rpV, rpC, rpT.toLocaleString('de-DE'), 'Rezepte');
  }

  // C) Asset-Abdeckung (Doughnut)
  if (ch.avg_pf_by_class) {
    const abc = ch.avg_pf_by_class;
    const abLabels = Object.keys(abc);
    const abData = abLabels.map(k => abc[k].count || 0);
    const abColors = abLabels.map(k => k==='FX' ? '#58a6ff' : (k==='Indizes' ? '#bc8cff' : '#d29922'));
    const abT = abData.reduce((a,b)=>a+b,0);
    _mkDoughnut('rd-asset', abLabels, abData, abColors, abT.toString(), 'Tests');
  }

  // D) Tier pro Asset-Klasse (Grouped Bar)
  if (ch.tier_by_class) {
    const tbc = ch.tier_by_class;
    const classes = Object.keys(tbc);
    const tiers = ['A','B','C'];
    const tColors = ['#3fb950','#d29922','#7d8590'];
    const ds = tiers.map((t,i) => ({
      label: 'Tier ' + t,
      data: classes.map(c => (tbc[c]||{})[t] || 0),
      backgroundColor: tColors[i]
    }));
    _mkBar('rd-tier', classes, ds);
  }

  // E) Cluster-Aufmerksamkeit (Horizontal Bar)
  if (ch.cluster_attention && ch.cluster_attention.length > 0) {
    const ca = ch.cluster_attention.slice(0,15);
    _mkBar('rd-cluster-att',
      ca.map(c => c.name.length > 28 ? c.name.slice(0,26)+'…' : c.name),
      [{ label: 'Strategien', data: ca.map(c => c.count), backgroundColor: 'rgba(88,166,255,0.7)' }],
      { horizontal: true });
  }

  // F) Source-Verteilung (Doughnut)
  if (ch.source_breakdown) {
    const sb = ch.source_breakdown;
    const sbLabel = sb.map(s => s.source.replace('iterative_discovery','iterat.').replace('cluster_synthesis','cluster').slice(0,16));
    const sbData = sb.map(s => s.count);
    const sbColors = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#7d8590','#22c55e','#ef4444','#eab308','#a78bfa'];
    _mkDoughnut('rd-source', sbLabel, sbData, sbColors.slice(0,sb.length), '');
  }

  // G) Top Cluster Performance (Horizontal Bar)
  if (ch.top_cluster_perf && ch.top_cluster_perf.length > 0) {
    const cp = ch.top_cluster_perf.slice(0,12);
    _mkBar('rd-cluster-perf',
      cp.map(c => c.name.length > 28 ? c.name.slice(0,26)+'…' : c.name),
      [{ label: 'Ø Score', data: cp.map(c => c.avg_pf || 0), backgroundColor: 'rgba(188,140,255,0.7)' }],
      { horizontal: true });
  }

  // H) Symbol Coverage (Horizontal Bar)
  if (ch.symbol_coverage) {
    const sc = ch.symbol_coverage;
    const aData = sc.map(s => Math.round(s.tier_a_pct));
    const cData = sc.map(s => 100 - Math.round(s.tier_a_pct));
    _mkBar('rd-symbols',
      sc.map(s => s.symbol),
      [
        { label: 'Tier A %', data: aData, backgroundColor: 'rgba(63,185,80,0.7)' },
        { label: 'Andere %', data: cData, backgroundColor: 'rgba(125,133,144,0.3)' }
      ],
      { horizontal: true, stacked: true });
  }

  // I) Weekly Focus Shift (Stacked Bar — only after innerHTML is set)
  if (ch.weekly_focus && ch.weekly_focus.length > 0) {
    const wf = ch.weekly_focus;
    _mkBar('rd-focus-shift',
      wf.map(w => w.week),
      [
        { label: 'FX', data: wf.map(w => w.FX), backgroundColor: 'rgba(88,166,255,0.7)' },
        { label: 'Indizes', data: wf.map(w => w.Indizes), backgroundColor: 'rgba(188,140,255,0.7)' },
        { label: 'Metalle', data: wf.map(w => w.Metalle), backgroundColor: 'rgba(210,153,34,0.7)' }
      ],
      { stacked: true });
  }

  // J) Daily Production (Bar)
  if (ch.daily_production && ch.daily_production.length > 0) {
    const dp = ch.daily_production;
    _mkBar('rd-daily',
      dp.map(d => d.date.slice(5)),
      [{ label: 'Neue Strategien', data: dp.map(d => d.count), backgroundColor: 'rgba(88,166,255,0.6)', borderRadius: 3 }]
    );
  }
}

// Tab switching
document.querySelectorAll('.sl4-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sl4-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    if (currentTab !== 'rdlive') _destroyRdCharts();
    sortCol = currentTab === 'shadow' ? 'net_pnl' : 'score'; sortDir = 'desc';
    renderTable();
  });
});

// Filter buttons
document.querySelectorAll('.sl4-filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sl4-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTable();
  });
});

// Search
document.getElementById('sl4-search').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderTable();
});

// Close modal on overlay click
document.getElementById('sl4-modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.target.classList.remove('show');
});

loadData();
</script>
