<!--TITLE:Research Library — Hermes-->
<!--HEAD-->
<style>
  .rl-header { margin-bottom: var(--s-6); }
  .rl-header h1 { font-size: var(--text-2xl); font-weight: 700; margin: 0 0 var(--s-1); }
  .rl-header p { color: var(--c-text-muted); font-size: var(--text-sm); margin: 0; }

  .rl-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--s-3); margin-bottom: var(--s-6); }
  .rl-stat-card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-xl); padding: var(--s-4) var(--s-5); text-align: center; }
  .rl-stat-card .rl-stat-value { font-size: var(--text-2xl); font-weight: 700; }
  .rl-stat-card .rl-stat-label { font-size: var(--text-xs); color: var(--c-text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  .rl-toolbar { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-bottom: var(--s-5); align-items: center; }
  .rl-filters { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .rl-filter-btn { padding: var(--s-2) var(--s-3); border: 1px solid var(--c-border); border-radius: var(--r-lg); background: transparent; color: var(--c-text-muted); font-size: var(--text-sm); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .rl-filter-btn:hover { border-color: var(--c-accent); color: var(--c-text); }
  .rl-filter-btn.active { background: var(--c-accent); border-color: var(--c-accent); color: #fff; }
  .rl-filter-btn .rl-count { margin-left: 4px; opacity: 0.7; font-size: var(--text-xs); }
  .rl-search { padding: var(--s-2) var(--s-3); border: 1px solid var(--c-border); border-radius: var(--r-lg); background: var(--c-surface); color: var(--c-text); font-size: var(--text-sm); min-width: 220px; outline: none; }
  .rl-search:focus { border-color: var(--c-accent); }
  .rl-search::placeholder { color: var(--c-text-muted); }

  .rl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--s-4); }

  .rl-card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-xl); padding: var(--s-5); cursor: pointer; transition: transform 0.15s, border-color 0.15s; display: flex; flex-direction: column; position: relative; }
  .rl-card:hover { transform: translateY(-2px); border-color: var(--c-accent); }
  .rl-card.rl-card-skipped { opacity: 0.45; border-left: 3px solid var(--c-danger); }
  .rl-card.rl-card-high { border-left: 3px solid var(--c-success); }
  .rl-card.rl-card-med { border-left: 3px solid var(--c-warn); }
  .rl-card.rl-card-lab { border: 1px solid rgba(180,100,255,0.28); box-shadow: 0 1px 12px rgba(180,100,255,0.08); }
  .rl-card.rl-card-lab-prof { border: 1px solid rgba(34,197,94,0.5); box-shadow: 0 2px 16px rgba(34,197,94,0.12); }
  .rl-card.rl-card-lab-prof .rl-card-top::after { content: "💰"; position: absolute; top: 10px; right: 46px; font-size: 15px; }
  .rl-card.rl-card-lab .rl-card-name { color: #c9a6ff; }
  .rl-card.rl-card-untested { border-left: 3px solid var(--c-accent); }

  .rl-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-2); margin-bottom: var(--s-2); }
  .rl-card-name { font-weight: 700; font-size: var(--text-base); line-height: 1.3; flex: 1; }
  .rl-score-badge { font-size: var(--text-xs); font-weight: 700; padding: 2px 8px; border-radius: var(--r-lg); white-space: nowrap; flex-shrink: 0; }
  .rl-score-high { background: rgba(34,197,94,.15); color: var(--c-success); }
  .rl-score-med { background: rgba(250,204,21,.15); color: var(--c-warn); }
  .rl-score-low { background: rgba(107,114,128,.15); color: var(--c-text-muted); }
  .rl-score-skip { background: rgba(239,68,68,.15); color: var(--c-danger); }

  .rl-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: var(--s-2); align-items: center; }
  .rl-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-lg); font-size: var(--text-xs); font-weight: 600; }
  .rl-badge-tf { background: var(--c-surface-2); color: var(--c-text-muted); border: 1px solid var(--c-border); }
  .rl-badge-cluster { background: rgba(100,149,237,0.12); color: #6495ed; }

  .rl-card-hypothesis { font-size: var(--text-sm); color: var(--c-text-muted); margin-bottom: var(--s-3); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
  .rl-card-skip { font-size: var(--text-xs); color: var(--c-danger); margin-bottom: var(--s-2); }

  .rl-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: var(--s-3); border-top: 1px solid var(--c-border); }
  .rl-card-meta { display: flex; gap: var(--s-3); font-size: var(--text-xs); color: var(--c-text-muted); }

  .rl-empty { text-align: center; padding: var(--s-10); color: var(--c-text-muted); }
  .rl-empty-icon { font-size: 32px; margin-bottom: var(--s-3); }

  /* Detail overlay */
  .rl-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; justify-content: center; align-items: flex-start; padding: var(--s-8) var(--s-4); overflow-y: auto; }
  .rl-overlay.visible { display: flex; }
  .rl-detail-panel { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-xl); width: 100%; max-width: 800px; padding: var(--s-6); position: relative; margin-bottom: var(--s-8); }
  .rl-detail-close { position: absolute; top: var(--s-4); right: var(--s-4); background: none; border: none; color: var(--c-text-muted); font-size: 20px; cursor: pointer; padding: var(--s-2); line-height: 1; }
  .rl-detail-close:hover { color: var(--c-text); }
  .rl-detail-title { font-size: var(--text-xl); font-weight: 700; margin-bottom: var(--s-1); padding-right: var(--s-10); }
  .rl-detail-meta { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-bottom: var(--s-5); }
  .rl-detail-tag { background: var(--c-surface-2); border: 1px solid var(--c-border); border-radius: var(--r-lg); padding: var(--s-1) var(--s-3); font-size: var(--text-xs); color: var(--c-text-muted); }
  .rl-detail-tag strong { color: var(--c-text); }
  .rl-detail-section { margin-top: var(--s-5); }
  .rl-detail-section h3 { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--s-3); padding-bottom: var(--s-2); border-bottom: 1px solid var(--c-border); }
  .rl-detail-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .rl-detail-table th { text-align: left; color: var(--c-text-muted); font-weight: 600; padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--c-border); font-size: var(--text-xs); text-transform: uppercase; }
  .rl-detail-table td { padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--c-border); vertical-align: top; }
  .rl-detail-table tr:last-child td { border-bottom: none; }
  .rl-detail-list { margin: 0; padding-left: var(--s-4); font-size: var(--text-sm); color: var(--c-text-2); }
  .rl-detail-list li { margin-bottom: var(--s-1); }

  .rl-loading { color: var(--c-text-muted); padding: var(--s-6); text-align: center; }

  @media (max-width: 640px) {
    .rl-grid { grid-template-columns: 1fr; }
    .rl-toolbar { flex-direction: column; align-items: stretch; }
    .rl-detail-panel { padding: var(--s-4); }
  }
</style>
<!--/HEAD-->
<!--BODY-->

<div class="rl-header">
  <h1>Research Library</h1>
  <p>67 recherchierte Strategien · Quality-Score aus WR, RR, Timeframe, Robustheit · 20 übersprungen (unpassende Assets / externe Daten)</p>
</div>

<div class="rl-summary" id="rl-summary">
  <div class="rl-stat-card"><div class="rl-stat-value" id="rl-total">—</div><div class="rl-stat-label">Gesamt</div></div>
  <div class="rl-stat-card"><div class="rl-stat-value" id="rl-eligible" style="color:#22c55e">—</div><div class="rl-stat-label">Tauglich</div></div>
  <div class="rl-stat-card"><div class="rl-stat-value" id="rl-skipped" style="color:var(--c-danger)">—</div><div class="rl-stat-label">Übersprungen</div></div>
  <div class="rl-stat-card"><div class="rl-stat-value" id="rl-highq" style="color:#facc15">—</div><div class="rl-stat-label">Score > 80</div></div>
  <div class="rl-stat-card"><div class="rl-stat-value" id="rl-1h" style="color:#6495ed">—</div><div class="rl-stat-label">1H Timeframe</div></div>
  <div class="rl-stat-card"><div class="rl-stat-value" id="rl-lab" style="color:#b464ff">—</div><div class="rl-stat-label">Im Lab getestet</div></div>
</div>

<div class="rl-toolbar">
  <div class="rl-filters" id="rl-filters"></div>
  <input type="text" class="rl-search" id="rl-search" placeholder="Suche Name oder Hypothese…">
</div>

<div id="rl-grid" class="rl-grid">
  <div class="rl-loading">Lade Research Library …</div>
</div>

<div class="rl-overlay" id="rl-overlay">
  <div class="rl-detail-panel" id="rl-detail-panel">
    <button class="rl-detail-close" id="rl-close">&times;</button>
    <div id="rl-detail-content"></div>
  </div>
</div>

<script>
(function() {
  'use strict';
  const API_BASE = '/api/strategy-lab';
  let allStrategies = [];
  let activeFilters = new Set();
  let searchQuery = '';

  const esc = s => { if (s == null) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; };
  const fmtNum = (n, dec) => { if (n == null) return '—'; return typeof dec === 'number' ? Number(n).toFixed(dec) : String(n); };

  function scoreClass(s) {
    if (s.skip) return 'rl-score-skip';
    if (s.quality_score >= 80) return 'rl-score-high';
    if (s.quality_score >= 60) return 'rl-score-med';
    return 'rl-score-low';
  }
  function cardClass(s) {
    var c = 'rl-card';
    if (s.skip) return c + ' rl-card-skipped';
    // Profitable lab-tested: green highlight (highest priority)
    if (s.lab_tested) {
      var prof = (s.lab_best_pf != null) ? (s.lab_best_pf >= 1) : (s.lab_best_pnl != null && s.lab_best_pnl > 0);
      if (prof) return c + ' rl-card-lab-prof';
      return c + ' rl-card-lab';
    }
    // Untested eligible concept: subtle accent border = open inspiration
    if (!s.skip) return c + ' rl-card-untested';
    if (s.quality_score >= 80) return c + ' rl-card-high';
    if (s.quality_score >= 60) return c + ' rl-card-med';
    return c;
  }

  // ── Load data ──
  async function loadData() {
    try {
      const r = await fetch(API_BASE + '/research-library.json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      allStrategies = data.strategies || [];

      document.getElementById('rl-total').textContent = data.total || 0;
      document.getElementById('rl-eligible').textContent = data.eligible || 0;
      document.getElementById('rl-skipped').textContent = data.skipped || 0;
      document.getElementById('rl-highq').textContent = (data.filters && data.filters.quality_gt_80) || 0;
      document.getElementById('rl-1h').textContent = (data.filters && data.filters.timeframe_1h) || 0;
      document.getElementById('rl-lab').textContent = (data.filters && data.filters.lab_tested) || 0;

      buildFilters();
      renderGrid();
    } catch(e) {
      document.getElementById('rl-grid').innerHTML = '<div class="rl-empty"><div class="rl-empty-icon">⚠️</div>Fehler: ' + esc(e.message) + '</div>';
    }
  }

  // ── Filters ──
  function buildFilters() {
    const container = document.getElementById('rl-filters');
    const filters = [
      { key: 'eligible', label: '✅ Tauglich' },
      { key: 'highq', label: '⭐ Score > 80' },
      { key: 'medq', label: '🔶 Score 60-80' },
      { key: 'skipped', label: '❌ Übersprungen' },
      { key: '1h', label: '⏰ 1H' },
      { key: 'forex', label: '🌍 Forex' },
      { key: 'indices', label: '📊 Indices' },
      { key: 'lab', label: '🧪 Im Lab getestet' },
      { key: 'labprof', label: '💰 Profitabel getestet' },
      { key: 'open', label: '🔍 Offen (Inspiration)' },
    ];
    let html = '';
    for (const f of filters) {
      const count = countForFilter(f.key);
      const isActive = activeFilters.has(f.key);
      html += '<button class="rl-filter-btn' + (isActive ? ' active' : '') + '" data-filter="' + f.key + '">' +
              esc(f.label) + '<span class="rl-count">(' + count + ')</span></button>';
    }
    container.innerHTML = html;
    container.querySelectorAll('.rl-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.filter;
        if (activeFilters.has(key)) activeFilters.delete(key);
        else activeFilters.add(key);
        buildFilters();
        renderGrid();
      });
    });
  }

  function countForFilter(key) {
    return allStrategies.filter(s => matchesFilter(s, key)).length;
  }

  function matchesFilter(s, key) {
    switch(key) {
      case 'eligible': return !s.skip;
      case 'highq': return !s.skip && s.quality_score >= 80;
      case 'medq': return !s.skip && s.quality_score >= 60 && s.quality_score < 80;
      case 'skipped': return s.skip;
      case '1h': return s.is_1h;
      case 'forex': return s.is_forex;
      case 'indices': return s.is_indices;
      case 'lab': return s.lab_tested;
      case 'labprof': return s.lab_tested && (s.lab_best_pf != null ? s.lab_best_pf >= 1 : (s.lab_best_pnl != null && s.lab_best_pnl > 0));
      case 'open': return !s.lab_tested && !s.skip;
      default: return true;
    }
  }

  function strategyMatches(s) {
    if (activeFilters.size > 0) {
      for (const f of activeFilters) { if (!matchesFilter(s, f)) return false; }
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!(s.name || '').toLowerCase().includes(q) && !(s.hypothesis || '').toLowerCase().includes(q)) return false;
    }
    return true;
  }

  // ── Grid ──
  function renderGrid() {
    const grid = document.getElementById('rl-grid');
    const filtered = allStrategies.filter(strategyMatches);
    // Sort: eligible by quality DESC, skipped at end
    filtered.sort((a, b) => {
      if (a.skip && !b.skip) return 1;
      if (!a.skip && b.skip) return -1;
      return (b.quality_score || 0) - (a.quality_score || 0);
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="rl-empty"><div class="rl-empty-icon">🔍</div>Keine Strategien gefunden</div>';
      return;
    }

    let html = '';
    for (const s of filtered) {
      html += '<div class="' + cardClass(s) + '" data-id="' + s.id + '">';

      // Top: name + score
      html += '<div class="rl-card-top">';
      html += '<div class="rl-card-name">' + esc(s.name) + '</div>';
      if (s.skip) {
        html += '<span class="rl-score-badge rl-score-skip">SKIP</span>';
      } else {
        html += '<span class="rl-score-badge ' + scoreClass(s) + '">' + s.quality_score + '</span>';
      }
      html += '</div>';

      // Badges
      html += '<div class="rl-card-badges">';
      if (s.timeframe) html += '<span class="rl-badge rl-badge-tf">' + esc(s.timeframe) + '</span>';
      if (s.cluster) html += '<span class="rl-badge rl-badge-cluster">' + esc(s.cluster) + '</span>';
      html += '</div>';

      // Skip reason or hypothesis
      if (s.skip) {
        html += '<div class="rl-card-skip">⚠️ ' + esc(s.skip_reason) + '</div>';
      }
      if (s.hypothesis) {
        html += '<div class="rl-card-hypothesis">' + esc(s.hypothesis) + '</div>';
      }

      // Footer
      html += '<div class="rl-card-footer"><div class="rl-card-meta">';
      var assets = (s.asset_classes && Array.isArray(s.asset_classes)) ? s.asset_classes.slice(0, 3) : [];
      html += '<span>📂 ' + esc(assets.join(', ') || '—') + '</span>';
      html += '<span>📚 ' + (s.source_count || 0) + 'Q</span>';
      if (s.reported_wr) html += '<span>WR ' + fmtNum(s.reported_wr, 0) + '%</span>';
      if (s.reported_rr) html += '<span>RR ' + fmtNum(s.reported_rr, 1) + '</span>';
      html += '</div>';
      // Lab badge (Provenienz: Konzept → Strategie #ID)
      if (s.lab_tested) {
        var lp = s.lab_best_pf;
        var lpStr = (lp != null) ? ' · PF ' + fmtNum(lp, 2) : ' · PF —';
        var pnlColor = (s.lab_best_pnl > 0) ? '#22c55e' : 'var(--c-danger)';
        var pnlStr = (s.lab_best_pnl != null) ? ((s.lab_best_pnl > 0 ? '+' : '') + Math.round(s.lab_best_pnl) + '€') : '—';
        var tTxt = s.lab_best_tier ? (' · ' + esc(s.lab_best_tier)) : '';
        // Tier-Farbe ehrlich: grün nur A, gelb B/C, rot rejected
        var tc = s.lab_best_tier === 'A' ? '#22c55e' : (s.lab_best_tier === 'B' ? '#facc15' : (s.lab_best_tier && s.lab_best_tier !== 'rejected' ? 'var(--c-warn)' : 'var(--c-danger)'));
        html += '<a href="/strategy-lab" onclick="event.stopPropagation();" title="Im Strategy Lab ansehen: #' + esc(s.lab_strategy_id) + '" ' +
          'style="font-size:var(--text-xs);font-weight:600;color:var(--c-accent);background:rgba(180,100,255,0.12);padding:2px 8px;border-radius:var(--r-lg);text-decoration:none;display:inline-flex;align-items:center;gap:3px">' +
          '🧪 → #' + esc(s.lab_strategy_id) + '<span style="color:' + pnlColor + '">' + pnlStr + '</span>' + lpStr +
          '<span style="color:' + tc + '">' + tTxt + '</span></a>';
      }
      html += '</div>';

      html += '</div>';
    }
    grid.innerHTML = html;
    grid.querySelectorAll('.rl-card').forEach(c => {
      c.addEventListener('click', () => loadDetail(c.dataset.id));
    });
  }

  // ── Search ──
  document.getElementById('rl-search').addEventListener('input', function(e) {
    searchQuery = e.target.value.trim();
    renderGrid();
  });

  // ── Detail overlay ──
  function loadDetail(id) {
    const overlay = document.getElementById('rl-overlay');
    const content = document.getElementById('rl-detail-content');
    content.innerHTML = '<div class="rl-loading">Lade …</div>';
    overlay.classList.add('visible');
    const s = allStrategies.find(x => String(x.id) === String(id));
    if (!s) { content.innerHTML = '<div class="rl-empty">Nicht gefunden</div>'; return; }
    renderDetail(s, content);
  }

  function renderDetail(s, container) {
    let html = '';
    html += '<div class="rl-detail-title">' + esc(s.name) + '</div>';
    html += '<div class="rl-detail-meta">';
    if (s.skip) {
      html += '<span class="rl-detail-tag" style="color:var(--c-danger)">⚠️ SKIP: ' + esc(s.skip_reason) + '</span>';
    } else {
      html += '<span class="rl-detail-tag">Quality: <strong>' + s.quality_score + '/100</strong></span>';
    }
    if (s.cluster) html += '<span class="rl-detail-tag">Cluster: <strong>' + esc(s.cluster) + '</strong></span>';
    if (s.timeframe) html += '<span class="rl-detail-tag">TF: <strong>' + esc(s.timeframe) + '</strong></span>';
    if (s.session) html += '<span class="rl-detail-tag">Session: <strong>' + esc(s.session) + '</strong></span>';
    html += '<span class="rl-detail-tag">Quellen: <strong>' + (s.source_count || 0) + '</strong></span>';
    html += '</div>';

    // Quality breakdown
    if (!s.skip && s.quality_components) {
      var qc = s.quality_components;
      html += '<div class="rl-detail-section"><h3>Quality-Score Breakdown (' + s.quality_score + '/100)</h3>';
      html += '<div class="rl-detail-table"><table class="rl-detail-table"><tbody>';
      html += '<tr><td style="color:var(--c-text-muted);width:180px">Expected Value (WR×RR)</td><td><strong>' + fmtNum(qc.ev, 1) + '</strong> / 50</td></tr>';
      html += '<tr><td style="color:var(--c-text-muted)">Timeframe-Fit</td><td><strong>' + qc.timeframe + '</strong> / 20</td></tr>';
      html += '<tr><td style="color:var(--c-text-muted)">Asset-Fit</td><td><strong>' + qc.asset + '</strong> / 15</td></tr>';
      html += '<tr><td style="color:var(--c-text-muted)">Robustheit</td><td><strong>' + fmtNum(qc.robustness, 1) + '</strong> / 12.5</td></tr>';
      html += '<tr><td style="color:var(--c-text-muted)">Datenqualität</td><td><strong>' + (qc.data_quality || 0) + '</strong> / 5</td></tr>';
      html += '</tbody></table></div></div>';
    }

    if (s.hypothesis) html += '<div class="rl-detail-section"><h3>💡 Hypothese</h3><p style="font-size:var(--text-sm);line-height:1.6">' + esc(s.hypothesis) + '</p></div>';
    if (s.edge_rationale) html += '<div class="rl-detail-section"><h3>🎯 Edge</h3><p style="font-size:var(--text-sm);line-height:1.6">' + esc(s.edge_rationale) + '</p></div>';

    if (s.best_when || s.worst_when) {
      html += '<div class="rl-detail-section"><h3>Bedingungen</h3><div class="rl-detail-table"><table><tbody>';
      if (s.best_when) html += '<tr><td style="color:var(--c-ok);font-weight:600;width:120px">✅ Funktioniert</td><td>' + esc(s.best_when) + '</td></tr>';
      if (s.worst_when) html += '<tr><td style="color:var(--c-err);font-weight:600">❌ Funktioniert nicht</td><td>' + esc(s.worst_when) + '</td></tr>';
      if (s.market_condition) html += '<tr><td style="color:var(--c-text-muted);font-weight:600">Markt</td><td>' + esc(s.market_condition) + '</td></tr>';
      html += '</tbody></table></div></div>';
    }

    if (s.entry_conditions || s.exit_tp_logic || s.exit_sl_logic) {
      html += '<div class="rl-detail-section"><h3>📍 Entry / Exit</h3><div class="rl-detail-table"><table><tbody>';
      if (s.entry_direction) html += '<tr><td style="color:var(--c-text-muted);width:120px">Richtung</td><td><strong>' + esc(s.entry_direction) + '</strong></td></tr>';
      if (s.entry_conditions && Array.isArray(s.entry_conditions) && s.entry_conditions.length > 0) {
        html += '<tr><td style="color:var(--c-text-muted)">Entry</td><td><ul class="rl-detail-list">';
        for (const c of s.entry_conditions) html += '<li>' + esc(c) + '</li>';
        html += '</ul></td></tr>';
      }
      if (s.indicators_needed && Array.isArray(s.indicators_needed) && s.indicators_needed.length > 0) {
        html += '<tr><td style="color:var(--c-text-muted)">Indikatoren</td><td>' + esc(s.indicators_needed.join(', ')) + '</td></tr>';
      }
      if (s.exit_tp_logic) html += '<tr><td style="color:var(--c-text-muted)">TP</td><td>' + esc(s.exit_tp_logic) + '</td></tr>';
      if (s.exit_sl_logic) html += '<tr><td style="color:var(--c-text-muted)">SL</td><td>' + esc(s.exit_sl_logic) + '</td></tr>';
      if (s.max_hold_hours) html += '<tr><td style="color:var(--c-text-muted)">Max Hold</td><td>' + s.max_hold_hours + 'h</td></tr>';
      html += '</tbody></table></div></div>';
    }

    if (s.reported_wr || s.reported_rr) {
      html += '<div class="rl-detail-section"><h3>📈 Berichtete Performance</h3><div class="rl-detail-table"><table><tbody>';
      if (s.reported_wr != null) html += '<tr><td style="color:var(--c-text-muted);width:120px">Win Rate</td><td><strong>' + fmtNum(s.reported_wr, 1) + '%</strong></td></tr>';
      if (s.reported_rr != null) html += '<tr><td style="color:var(--c-text-muted)">R:R</td><td><strong>' + fmtNum(s.reported_rr, 2) + '</strong></td></tr>';
      if (s.reported_trades_per_week) html += '<tr><td style="color:var(--c-text-muted)">Trades/Woche</td><td>' + fmtNum(s.reported_trades_per_week, 1) + '</td></tr>';
      if (s.reported_sample_size) html += '<tr><td style="color:var(--c-text-muted)">Stichprobe</td><td>' + esc(s.reported_sample_size) + '</td></tr>';
      html += '</tbody></table></div></div>';
    }

    // ── Lab Results ──
    if (s.lab_tested) {
      var pnlColor = (s.lab_best_pnl > 0) ? '#22c55e' : 'var(--c-danger)';
      var pnlStr = (s.lab_best_pnl != null) ? ((s.lab_best_pnl > 0 ? '+' : '') + Math.round(s.lab_best_pnl) + '€') : '—';
      html += '<div class="rl-detail-section"><h3>🧪 Lab-Ergebnis</h3>';
      html += '<div class="rl-detail-table"><table><tbody>';
      html += '<tr><td style="color:var(--c-text-muted);width:120px">OOS PnL</td><td><strong style="color:' + pnlColor + ';font-size:var(--text-lg)">' + pnlStr + '</strong></td></tr>';
      if (s.lab_best_pf != null) html += '<tr><td style="color:var(--c-text-muted)">Gewinnfaktor</td><td><strong>' + fmtNum(s.lab_best_pf, 2) + '</strong></td></tr>';
      if (s.lab_best_tier) {
        var tColor = s.lab_best_tier === 'A' ? '#22c55e' : s.lab_best_tier === 'B' ? '#facc15' : (s.lab_best_tier === 'rejected' ? 'var(--c-danger)' : 'var(--c-warn)');
        var tExtra = (s.lab_best_tier === 'rejected') ? ' <span style="color:var(--c-text-muted);font-weight:400">(Gates abgelehnt)</span>' : '';
        html += '<tr><td style="color:var(--c-text-muted)">Tier</td><td><strong style="color:' + tColor + '">' + esc(s.lab_best_tier) + '</strong>' + tExtra + '</td></tr>';
      }
      if (s.lab_legacy_tier) html += '<tr><td style="color:var(--c-text-muted)">Tier (legacy)</td><td>' + esc(s.lab_legacy_tier) + '</td></tr>';
      if (s.lab_oos_trades != null) html += '<tr><td style="color:var(--c-text-muted)">OOS Trades</td><td>' + s.lab_oos_trades + '</td></tr>';
      if (s.lab_oos_wr != null) html += '<tr><td style="color:var(--c-text-muted)">OOS Win Rate</td><td>' + fmtNum(s.lab_oos_wr, 1) + '%</td></tr>';
      if (s.lab_strategy_name) html += '<tr><td style="color:var(--c-text-muted)">Strategie</td><td>' + esc(s.lab_strategy_name) + '</td></tr>';
      if (s.lab_strategy_status) html += '<tr><td style="color:var(--c-text-muted)">Status</td><td>' + esc(s.lab_strategy_status) + '</td></tr>';
      if (s.lab_strategy_id) html += '<tr><td style="color:var(--c-text-muted)">Strategy Lab ID</td><td><a href="/strategy-lab" style="color:var(--c-accent)">#' + esc(s.lab_strategy_id) + ' →</a></td></tr>';
      html += '</tbody></table></div></div>';
    }

    container.innerHTML = html;
  }

  // ── Close overlay ──
  document.getElementById('rl-close').addEventListener('click', () => {
    document.getElementById('rl-overlay').classList.remove('visible');
  });
  document.getElementById('rl-overlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('visible');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('rl-overlay').classList.remove('visible');
  });

  // ── Init ──
  loadData();
})();
</script>
<!--/BODY-->
