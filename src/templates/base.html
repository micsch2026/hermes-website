<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="stylesheet" href="/assets/base.css">
<script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.className=t;})();</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
{{extra_head}}
</head>
<body>
<header id="site-header">
{{nav}}
</header>

<main>
{{content}}
</main>

<script>
if (typeof lucide !== 'undefined') lucide.createIcons();
// Scroll active nav link into view on mobile
document.addEventListener('DOMContentLoaded', function(){
  var active = document.querySelector('.nav a[aria-current="page"]');
  if(active && active.scrollIntoView){
    active.scrollIntoView({inline:'center',behavior:'instant'});
  }
});
// Bots-Dropdown: Klick-Toggle (Desktop + Touch), Hover bleibt via CSS
(function(){
  var drops = document.querySelectorAll('.nav-drop');
  function closeAll(except){ drops.forEach(function(d){ if(d !== except) d.classList.remove('open'); }); }
  drops.forEach(function(d){
    var a = d.querySelector('a');
    if(!a) return;
    a.addEventListener('click', function(e){
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      var was = d.classList.contains('open');
      closeAll(d);
      d.classList.toggle('open', !was);
    });
  });
  document.addEventListener('click', function(e){
    if(!(e.target && e.target.closest && e.target.closest('.nav-drop'))) closeAll(null);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeAll(null);
  });
})();
</script>
</body>
</html>
